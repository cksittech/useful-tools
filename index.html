<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Structured Output Schema Builder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    #root { min-height: 100vh; }
  </style>
  <script src="lib/react.min.js"></script>
  <script src="lib/react-dom.min.js"></script>
  <script src="lib/material-ui.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const {
      Box, Button, IconButton, TextField, Select, MenuItem, InputLabel,
      FormControl, Paper, Typography,
      Stack, Tabs, Tab, AppBar, Toolbar,
      Container, Grid, Snackbar, Alert,
    } = MaterialUI;
    const h = React.createElement;
    const { useState, useMemo, useRef, useEffect } = React;

    const uid = () => Math.random().toString(36).slice(2, 10);

    // valueType: "enum" | "string" | "number" | "integer" | "boolean" | "array"
    // "array" のときのみ children を持ち、複数セットをまとめて配列として抽出する項目になる（入れ子可）
    const makeField = (overrides) => ({
      id: uid(),
      name: "",
      valueType: "string",
      enumValues: [],
      description: "",
      children: [],
      ...overrides,
    });

    const makeInitialProperties = () => [makeField({ valueType: "string" })];

    const SCHEMA_NAME_DEFAULT = "checker";
    const INTRO_TEXT_DEFAULT = "この画像を見て、スキーマに沿って回答してください。";

    // string: enum なしの自由記述文字列 / enum: 値リストから1つ選択 / array: 複数セットの配列
    const SIMPLE_TYPES = ["string", "number", "integer", "boolean"];

    // --- ロジック: プロパティから JSON Schema / Python コードを組み立てる ---

    function buildFieldSchema(prop) {
      if (prop.valueType === "enum") {
        return {
          type: "string",
          enum: (prop.enumValues || []).filter((v) => v !== ""),
          description: prop.description || "",
        };
      }
      return { type: prop.valueType || "string", description: prop.description || "" };
    }

    function buildItemSchema(item) {
      if (item.valueType === "array") {
        return {
          type: "array",
          description: item.description || "",
          items: buildJsonSchema(item.children),
        };
      }
      return buildFieldSchema(item);
    }

    function buildJsonSchema(items) {
      const props = {};
      const required = [];
      items.forEach((item) => {
        if (!item.name) return;
        props[item.name] = buildItemSchema(item);
        required.push(item.name);
      });
      return {
        type: "object",
        properties: props,
        required,
        additionalProperties: false,
      };
    }

    function pyStringLiteral(s) {
      return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
    }

    // items（プロパティ / 配列グループの混在配列）を SCHEMA 辞書の Python リテラルとして再帰的に書き出す
    function pushSchemaObjectLines(lines, items, indent) {
      const pad = "    ".repeat(indent);
      lines.push(`${pad}"type": "object",`);
      lines.push(`${pad}"properties": {`);
      items.forEach((item) => {
        if (!item.name) return;
        lines.push(`${pad}    ${pyStringLiteral(item.name)}: {`);
        if (item.valueType === "array") {
          lines.push(`${pad}        "type": "array",`);
          lines.push(`${pad}        "description": ${pyStringLiteral(item.description || "")},`);
          lines.push(`${pad}        "items": {`);
          pushSchemaObjectLines(lines, item.children, indent + 3);
          lines.push(`${pad}        },`);
        } else if (item.valueType === "enum") {
          lines.push(`${pad}        "type": "string",`);
          lines.push(
            `${pad}        "enum": [${(item.enumValues || [])
              .filter((v) => v !== "")
              .map(pyStringLiteral)
              .join(", ")}],`
          );
          lines.push(`${pad}        "description": ${pyStringLiteral(item.description || "")}`);
        } else {
          lines.push(`${pad}        "type": ${pyStringLiteral(item.valueType || "string")},`);
          lines.push(`${pad}        "description": ${pyStringLiteral(item.description || "")}`);
        }
        lines.push(`${pad}    },`);
      });
      lines.push(`${pad}},`);
      const requiredNames = items.filter((p) => p.name).map((p) => p.name);
      lines.push(
        `${pad}"required": [${requiredNames.map(pyStringLiteral).join(", ")}],`
      );
      lines.push(`${pad}"additionalProperties": False`);
    }

    function buildPythonCode({ properties, schemaName, introText }) {
      const lines = [];

      lines.push("SCHEMA = {");
      pushSchemaObjectLines(lines, properties, 1);
      lines.push("}");
      lines.push("");

      lines.push("input_text = (");
      lines.push(`    ${pyStringLiteral(introText)}`);
      lines.push(")");
      lines.push("");

      lines.push("response = client.responses.create(");
      lines.push('    model="gpt-4o",');
      lines.push("    input=input_data,");
      lines.push('    text={');
      lines.push('        "format": {');
      lines.push('            "type": "json_schema",');
      lines.push(`            "name": ${pyStringLiteral(schemaName)},`);
      lines.push('            "schema": SCHEMA,');
      lines.push('            "strict": True');
      lines.push("        }");
      lines.push("    }");
      lines.push(")");

      return lines.join("\n");
    }

    // --- UI コンポーネント ---

    // 入力・選択が必要なフィールドは、カード背景が濃くても常に白背景で読みやすくする
    const FIELD_BG = { bgcolor: "background.paper", borderRadius: 1 };

    // enum の選択肢を1つずつのテキスト入力として編集する
    function EnumValuesEditor({ values, onChange }) {
      const list = values && values.length ? values : [""];
      const inputRefs = useRef([]);
      const focusIndex = useRef(null);

      useEffect(() => {
        if (focusIndex.current !== null) {
          const el = inputRefs.current[focusIndex.current];
          if (el) el.focus();
          focusIndex.current = null;
        }
      });

      const updateAt = (index, value) => {
        const next = [...list];
        next[index] = value;
        onChange(next);
      };

      const removeAt = (index) => {
        const next = list.filter((_, i) => i !== index);
        onChange(next.length ? next : [""]);
      };

      const addValue = () => onChange([...list, ""]);

      const handleKeyDown = (index, e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (index === list.length - 1) {
          focusIndex.current = index + 1;
          onChange([...list, ""]);
        } else {
          const el = inputRefs.current[index + 1];
          if (el) el.focus();
        }
      };

      return h(Stack, { spacing: 1 },
        ...list.map((v, index) =>
          h(Stack, { key: index, direction: "row", spacing: 1, alignItems: "center" },
            h(TextField, {
              size: "small",
              value: v,
              placeholder: `選択肢 ${index + 1}`,
              onChange: (e) => updateAt(index, e.target.value),
              onKeyDown: (e) => handleKeyDown(index, e),
              inputRef: (el) => { inputRefs.current[index] = el; },
              error: !v,
              sx: { minWidth: 220, ...FIELD_BG },
            }),
            h(IconButton, {
              size: "small",
              color: "error",
              disabled: list.length <= 1,
              onClick: () => removeAt(index),
            }, "✕")
          )
        ),
        h(Button, { size: "small", variant: "outlined", onClick: addValue, sx: { alignSelf: "flex-start" } }, "+ 選択肢を追加")
      );
    }

    // ネストの深さに応じてカードの背景を段階的に黒くする（5段階、深いほど暗い）
    const ARRAY_DEPTH_SHADES = ["grey.50", "grey.300", "grey.500", "grey.700", "grey.900"];
    function arrayDepthColor(depth) {
      return ARRAY_DEPTH_SHADES[Math.min(depth, ARRAY_DEPTH_SHADES.length - 1)];
    }

    // 単純プロパティ・配列グループ（入れ子可）を1つで扱う再帰コンポーネント
    function ItemRow({ item, onChange, onRemove, depth }) {
      const isEnum = item.valueType === "enum";
      const isArray = item.valueType === "array";

      const updateChild = (id, next) => {
        onChange({ ...item, children: item.children.map((c) => (c.id === id ? next : c)) });
      };
      const removeChild = (id) => {
        onChange({ ...item, children: item.children.filter((c) => c.id !== id) });
      };
      const addChild = () => {
        onChange({ ...item, children: [...item.children, makeField({})] });
      };

      const bgcolor = isArray ? arrayDepthColor(depth) : undefined;

      return h(Paper, {
        variant: "outlined",
        sx: {
          p: 2,
          ...(isArray ? { borderStyle: "dashed", borderWidth: 2, bgcolor } : null),
        },
      },
        h(Stack, { spacing: 1.5 },
          h(Stack, { direction: "row", spacing: 1.5, alignItems: "center", flexWrap: "wrap" },
            h(TextField, {
              size: "small",
              label: "プロパティ名",
              value: item.name,
              onChange: (e) => onChange({ ...item, name: e.target.value }),
              error: !item.name,
              sx: { minWidth: 200, ...FIELD_BG },
            }),
            h(FormControl, { size: "small", sx: { minWidth: 160, ...FIELD_BG } },
              h(InputLabel, null, "型"),
              h(Select, {
                label: "型",
                value: item.valueType || "string",
                onChange: (e) => {
                  const nextType = e.target.value;
                  const needsInitialChild = nextType === "array" && item.children.length === 0;
                  onChange({
                    ...item,
                    valueType: nextType,
                    children: needsInitialChild ? [makeField({})] : item.children,
                  });
                },
              },
                h(MenuItem, { value: "enum" }, "string (enum)"),
                ...SIMPLE_TYPES.map((t) => h(MenuItem, { key: t, value: t }, t)),
                h(MenuItem, { value: "array" }, "array")
              )
            ),
            h(Box, { sx: { flexGrow: 1 } }),
            h(IconButton, { color: "error", onClick: onRemove }, "✕")
          ),
          h(TextField, {
            size: "small",
            label: "説明",
            value: item.description,
            onChange: (e) => onChange({ ...item, description: e.target.value }),
            error: !item.description,
            fullWidth: true,
            sx: FIELD_BG,
          }),
          isEnum &&
            h(EnumValuesEditor, {
              values: item.enumValues,
              onChange: (next) => onChange({ ...item, enumValues: next }),
            }),
          isArray &&
            h(Stack, { spacing: 1.5 },
              h(Stack, { spacing: 1, sx: { pl: 2, borderLeft: "2px solid", borderColor: "divider" } },
                ...item.children.map((child) =>
                  h(ItemRow, {
                    key: child.id,
                    item: child,
                    depth: depth + 1,
                    onChange: (next) => updateChild(child.id, next),
                    onRemove: () => removeChild(child.id),
                  })
                ),
                h(Button, { size: "small", variant: "outlined", onClick: addChild, sx: { alignSelf: "flex-start" } }, "+ セット内の項目を追加")
              )
            )
        )
      );
    }

    function SchemaEditorTab({ properties, setProperties }) {
      const addProperty = () => {
        setProperties([...properties, makeField({})]);
      };

      const updateProperty = (id, next) => {
        setProperties(properties.map((p) => (p.id === id ? next : p)));
      };

      const removeProperty = (id) => {
        setProperties(properties.filter((p) => p.id !== id));
      };

      return h(Stack, { spacing: 2 },
        h(Typography, { variant: "h6" }, "プロパティ"),
        ...properties.map((item) =>
          h(ItemRow, {
            key: item.id,
            item,
            depth: 0,
            onChange: (next) => updateProperty(item.id, next),
            onRemove: () => removeProperty(item.id),
          })
        ),
        h(Button, { variant: "contained", onClick: addProperty, sx: { alignSelf: "flex-start" } }, "+ プロパティ追加")
      );
    }

    function CodeBlock({ title, code, onCopy }) {
      return h(Paper, { variant: "outlined", sx: { p: 2 } },
        h(Stack, { spacing: 1 },
          h(Stack, { direction: "row", alignItems: "center" },
            h(Typography, { variant: "subtitle1", sx: { flexGrow: 1 } }, title),
            h(Button, { size: "small", variant: "outlined", onClick: onCopy }, "コピー")
          ),
          h(Box, {
            component: "pre",
            sx: {
              m: 0,
              p: 1.5,
              bgcolor: "grey.900",
              color: "grey.100",
              borderRadius: 1,
              overflowX: "auto",
              fontSize: 13,
              fontFamily: "Menlo, Consolas, monospace",
              maxHeight: 480,
            },
          }, code)
        )
      );
    }

    function OutputTab({ properties, schemaName, setSchemaName, introText, setIntroText, onCopied }) {
      const jsonSchema = useMemo(
        () => buildJsonSchema(properties),
        [properties]
      );
      const jsonSchemaText = useMemo(
        () => JSON.stringify(jsonSchema, null, 2),
        [jsonSchema]
      );
      const pythonCode = useMemo(
        () => buildPythonCode({ properties, schemaName, introText }),
        [properties, schemaName, introText]
      );

      const copy = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
          onCopied();
        } catch (e) {
          // no-op: クリップボード権限がない環境
        }
      };

      return h(Stack, { spacing: 2 },
        h(Stack, { direction: "row", spacing: 2, flexWrap: "wrap" },
          h(TextField, {
            size: "small",
            label: "スキーマ名（json_schema.name）",
            value: schemaName,
            onChange: (e) => setSchemaName(e.target.value),
            sx: { minWidth: 260 },
          }),
        ),
        h(TextField, {
          size: "small",
          label: "プロンプト文",
          value: introText,
          onChange: (e) => setIntroText(e.target.value),
          fullWidth: true,
        }),
        h(Grid, { container: true, spacing: 2 },
          h(Grid, { item: true, xs: 12, lg: 6 },
            h(CodeBlock, {
              title: "JSON Schema",
              code: jsonSchemaText,
              onCopy: () => copy(jsonSchemaText),
            })
          ),
          h(Grid, { item: true, xs: 12, lg: 6 },
            h(CodeBlock, {
              title: "Sample (Python)",
              code: pythonCode,
              onCopy: () => copy(pythonCode),
            })
          )
        )
      );
    }

    function App() {
      const [properties, setProperties] = useState(makeInitialProperties);
      const [tab, setTab] = useState(0);
      const [schemaName, setSchemaName] = useState(SCHEMA_NAME_DEFAULT);
      const [introText, setIntroText] = useState(INTRO_TEXT_DEFAULT);
      const [snackOpen, setSnackOpen] = useState(false);

      return h(Box, { sx: { minHeight: "100vh", bgcolor: "background.default" } },
        h(AppBar, { position: "static", color: "default", elevation: 1 },
          h(Toolbar, null,
            h(Typography, { variant: "h6" }, "Structured Output Schema Builder")
          )
        ),
        h(Container, { maxWidth: "xl", sx: { py: 3 } },
          h(Tabs, {
            value: tab,
            onChange: (_e, v) => setTab(v),
            sx: { mb: 2 },
          },
            h(Tab, { label: "スキーマ編集" }),
            h(Tab, { label: "出力" })
          ),
          tab === 0
            ? h(SchemaEditorTab, { properties, setProperties })
            : h(OutputTab, {
                properties,
                schemaName, setSchemaName,
                introText, setIntroText,
                onCopied: () => setSnackOpen(true),
              })
        ),
        h(Snackbar, {
          open: snackOpen,
          autoHideDuration: 1800,
          onClose: () => setSnackOpen(false),
          anchorOrigin: { vertical: "bottom", horizontal: "center" },
        },
          h(Alert, { severity: "success", variant: "filled" }, "クリップボードにコピーしました")
        )
      );
    }

    ReactDOM.render(h(App), document.getElementById("root"));
  </script>
</body>
</html>
