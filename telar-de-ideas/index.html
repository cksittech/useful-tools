          h(TextField, {
            autoFocus: true, variant: 'outlined', label: 'Workflow name', size: 'small', fullWidth: true, value: name,
            onChange: e => setName(e.target.value), sx: { mt: 1 },
          })
        ),
        h(DialogActions, null,
          h(Button, { onClick: onClose }, 'Cancel'),
          h(Button, { variant: 'contained', disabled: !name.trim(), onClick: () => onSave(name.trim()) }, 'Save')
        )
      );
    }

    // Wrapper's Max retries: a number field whose step below 0 is ∞ (UNLIMITED_RETRIES);
    // ↑/↓ keys and the ▲/▼ buttons step, "∞" or a negative number typed means ∞.
    function RetriesField({ value, disabled, onChange }) {
      const unlimited = value === UNLIMITED_RETRIES;
      const step = d => onChange(Math.max(UNLIMITED_RETRIES, (unlimited ? -1 : value) + d));
      // Digits typed next to "∞" replace it; "-…" or a lone "∞" means ∞; empty means 0.
      const parse = text => {
        if (/^\s*-/.test(text)) return UNLIMITED_RETRIES;
        const digits = text.replace(/[^0-9]/g, '');
        return digits ? parseInt(digits, 10) : (text.includes('∞') ? UNLIMITED_RETRIES : 0);
      };
      const arrow = (label, d) => h(IconButton, {
        size: 'small', disabled, tabIndex: -1, sx: { p: 0, fontSize: 10, lineHeight: 1 }, onClick: () => step(d),
      }, label);
      return h(TextField, {
        label: 'Max retries', size: 'small', fullWidth: true, variant: 'outlined', disabled,
        value: unlimited ? '∞' : String(value),
        inputProps: { inputMode: 'numeric', 'data-testid': 'max-retries' },
        onChange: e => onChange(parse(e.target.value)),
        onKeyDown: e => {
          if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); step(e.key === 'ArrowUp' ? 1 : -1); }
        },
        InputProps: {
          endAdornment: h(InputAdornment, { position: 'end' },
            h(Box, { sx: { display: 'flex', flexDirection: 'column' } }, arrow('▲', 1), arrow('▼', -1))),
        },
        helperText: unlimited ? 'Retries until the conditions pass (or Stop)' : undefined,
      });
    }

    // Add-node menu: one button per node type.
    function NodeTypeButtons({ types, color, onAdd }) {
      return h(Box, { sx: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 1 } },
        types.map(t => h(Button, {
          key: t.type, size: 'small', variant: 'outlined', fullWidth: true,
          sx: { color, borderColor: color }, onClick: () => onAdd(t.type),
        }, t.title))
      );
    }

    function FlowApp() {
      const [nodes, setNodes] = useState({});
      const [edges, setEdges] = useState([]);
      const [selection, setSelection] = useState(null);
      // Right-side panel for the selected node. editPanelClosed (X button) resets when
      // the selection moves to another node — done during render, the React pattern
      // for state derived from a changing input, so no stale frame commits.
      const [editPanelClosed, setEditPanelClosed] = useState(false);
      const selectedNodeId = (selection && selection.type === 'node') ? selection.id : null;
      const prevSelectedNodeIdForPanelRef = useRef(selectedNodeId);
      if (prevSelectedNodeIdForPanelRef.current !== selectedNodeId) {
        prevSelectedNodeIdForPanelRef.current = selectedNodeId;
        if (editPanelClosed) setEditPanelClosed(false);
      }
      const editingNode = (selectedNodeId && !editPanelClosed) ? nodes[selectedNodeId] : null;
      const [templates, setTemplates] = useState([]);
      const [templatesError, setTemplatesError] = useState(null);
      const [templateManagerOpen, setTemplateManagerOpen] = useState(false);
      const [editTarget, setEditTarget] = useState(null);
      const [isRunningWorkflow, setIsRunningWorkflow] = useState(false);
      const [currentWorkflowId, setCurrentWorkflowId] = useState(null);
      const [currentWorkflowName, setCurrentWorkflowName] = useState('');
      const [saveWorkflowOpen, setSaveWorkflowOpen] = useState(false);
      const [workflows, setWorkflows] = useState([]);
      const [workflowsError, setWorkflowsError] = useState(null);
      const [confirmState, setConfirmState] = useState(null);
      // Pre-run check dialog: null (closed) or { runBlocked }.
      const [issuesDialog, setIssuesDialog] = useState(null);
      const [runLog, setRunLog] = useState([]);
      const [historyOpen, setHistoryOpen] = useState(false);
      // Node/workflow menu: hidden behind the canvas "+" button until opened.
      const [menuOpen, setMenuOpen] = useState(false);
      // Hourglass waiting reasons only once a run has started — an idle,
      // never-run graph stays neutral (same rule as the card border's run state).
      const [showWaiting, setShowWaiting] = useState(false);
      // GET /node-types: the type list (menu order) and files that failed to load.
      const [nodeTypeList, setNodeTypeList] = useState([]);
      const [nodeTypeErrors, setNodeTypeErrors] = useState([]);
      const typesByType = useMemo(() => Object.fromEntries(nodeTypeList.map(t => [t.type, t])), [nodeTypeList]);
      // 'connecting' until the first answer, 'down' while api_server.py is unreachable
      // (the canvas is covered and can't be edited), else 'ok'.
      const [serverState, setServerState] = useState('connecting');
      // POST /evaluate's latest answer (common.py editor_view).
      const [view, setView] = useState({ nodes: {}, issues: [], connected: [] });
      // A server run is alive (also while only its Delays are left) — the Stop button.
      const [runLive, setRunLive] = useState(false);
      function askConfirm(message, action, opts) {
        setConfirmState({ message, action, confirmLabel: opts && opts.confirmLabel, confirmColor: opts && opts.confirmColor });
      }

      // Bottom-center error toast for failures with no natural inline spot
      // (e.g. opening a thread-id folder that doesn't exist yet).
      const [toast, setToast] = useState(null);
      const notify = msg => setToast(msg);

      // Created Nodes are stored server-side as JSON files (api_server.py /nodes).
      function loadTemplates() {
        fetchNodeList()
          .then(data => { setTemplates(data.nodes || []); setTemplatesError(null); })
          .catch(e => setTemplatesError(`Could not load AI nodes — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`));
      }
      // Node types first; retried until api_server.py answers. The menu's lists load
      // each time the server comes (back) up.
      useEffect(() => {
        let timer = null;
        let cancelled = false;
        function load() {
          fetchNodeTypes()
            .then(body => {
              if (cancelled) return;
              setNodeTypeList(body.types || []);
              setNodeTypeErrors(body.errors || []);
              setServerState('ok');
            })
            .catch(() => {
              if (cancelled) return;
              setServerState('down');
              timer = setTimeout(load, SERVER_RETRY_MS);
            });
        }
        load();
        return () => { cancelled = true; clearTimeout(timer); };
      }, []);
      useEffect(() => {
        if (serverState !== 'ok') return;
        loadTemplates();
        loadWorkflowList();
      }, [serverState]);
      // Keeps each Created Node's definition fields (name/content/outputs) in step
      // with its palette template (data.templateId); run state is untouched. A node
      // without templateId matches by title only when exactly one template has that
      // name. A function, not just an effect: loadWorkflow calls it too, since
      // loading replaces `nodes` without `templates` changing.
      function syncTemplateNodesWithCatalog(templatesList) {
        if (!templatesList.length) return;
        const byId = {};
        const nameCounts = {};
        templatesList.forEach(t => { byId[t.id] = t; nameCounts[t.name] = (nameCounts[t.name] || 0) + 1; });
        const byUniqueName = {};
        templatesList.forEach(t => { if (nameCounts[t.name] === 1) byUniqueName[t.name] = t; });

        setNodes(prev => {
          let changed = false;
          const next = { ...prev };
          Object.values(prev).forEach(node => {
            if (node.type !== 'template') return;
            const template = (node.data.templateId && byId[node.data.templateId])
              || (!node.data.templateId ? byUniqueName[node.data.title] : null);
            if (!template) return;
            const outputs = (template.outputs || []).map(normalizeOutputField);
            const inSync = node.data.templateId === template.id && node.data.title === template.name
              && node.data.content === template.content
              && JSON.stringify(outputs) === JSON.stringify(node.data.outputs);
            if (inSync) return;
            changed = true;
            next[node.id] = {
              ...node,
              data: { ...node.data, templateId: template.id, title: template.name, content: template.content, outputs },
            };
          });
          return changed ? next : prev;
        });
      }
      useEffect(() => { syncTemplateNodesWithCatalog(templates); }, [templates]);

      // Dragging/panning/zooming/connection-dragging are all handled by
      // React Flow — screenToFlowPosition() converts a screen point to
      // flow coordinates (resize dragging, placing a new node at center).
      const rfInstance = useReactFlow();
      const updateNodeInternals = useUpdateNodeInternals();
      const paneWrapRef = useRef(null);
      const nodeIdRef = useRef(1);
      const edgeIdRef = useRef(1);
      const zCounterRef = useRef(1);
      // Only the hand-rolled resize-handle drag still needs a persistent
      // window listener pair (React Flow's own NodeResizer would steal
      // the west/east ports' hit area — see PortHandle/makeResizeHandles).
      const interactionRef = useRef({ mode: null });
      // Kept fresh so async callers (the run client starting a run, log
      // entries resolving a node's title) always read each node's latest
      // data instead of the stale snapshot from render start.
      const nodesRef = useRef(nodes);
      const edgesRef = useRef(edges);
      // Latest server view / type list, for callbacks (log titles) that outlive a render.
      const viewRef = useRef(view);
      viewRef.current = view;
      const typesByTypeRef = useRef(typesByType);
      typesByTypeRef.current = typesByType;
      // React Flow drags fire 'position' on every pointermove, uncapped —
      // coalesce to one setNodes commit per frame, like flush() below.
      const pendingPositionsRef = useRef(new Map());
      const positionRafRef = useRef(null);

      const logSeqRef = useRef(0);   // unique React key per log entry
      // nodeId null = workflow-level event. level: info|success|warning|error.
      const logEvent = useCallback((nodeId, message, level = 'info') => {
        // Title captured now — the node may be gone/renamed by the time the log is read.
        const node = nodeId && nodesRef.current[nodeId];
        const nodeView = nodeId && viewRef.current.nodes[nodeId];
        const title = nodeView ? nodeView.title : node ? ((typesByTypeRef.current[node.type] || {}).title || node.type) : nodeId;
        const run = runnerRef.current ? runnerRef.current.activeRun.id : 0;
        const entry = { seq: ++logSeqRef.current, at: Date.now(), run, nodeId, title, message, level };
        setRunLog(prev => (prev.length >= RUN_LOG_MAX ? prev.slice(prev.length - RUN_LOG_MAX + 1) : prev).concat(entry));
      }, []);

      useEffect(() => { nodesRef.current = nodes; }, [nodes]);
      useEffect(() => { edgesRef.current = edges; }, [edges]);

      // Belt-and-suspenders: force React Flow to re-measure every node's
      // handle positions (not just the one dragged/resized) once an
      // interaction ends. On a large graph, the rapid re-render stream a
      // drag produces has been observed to strand some OTHER untouched
      // node's handleBounds; this is cheap since it only runs once per
      // interaction, not per frame.
      const resyncAllNodeInternals = useCallback(() => {
        updateNodeInternals(Object.keys(nodesRef.current));
      }, [updateNodeInternals]);

      useEffect(() => {
        // Coalesce a raw mousemove stream (can exceed 60/s) to one commit
        // per animation frame — calling setNodes on every event outran
        // React Flow's node lookup and dropped nodes from the canvas
        // mid-drag (underlying state stayed intact; reopening recovered it).
        let rafId = null;
        let pending = null;
        function flush() {
          rafId = null;
          if (!pending) return;
          const { id, width, bodyHeight, x, y } = pending;
          pending = null;
          setNodes(prev => prev[id] ? { ...prev, [id]: { ...prev[id], width, bodyHeight, x, y } } : prev);
          // React Flow's own ResizeObserver can drop a notification under
          // this drag's rapid-fire churn — force a synchronous re-measure
          // instead of hoping it catches up, since we already know the new size.
          updateNodeInternals(id);
        }
        function onMove(e) {
          const it = interactionRef.current;
          if (it.mode !== 'resizeNode') return;
          // Mouse released outside a place this window sees mouseup (past
          // the taskbar, focus lost) would otherwise strand the
          // interaction in resizeNode mode forever — bail once the
          // primary button reads as no longer held.
          if (!(e.buttons & 1)) { onUp(); return; }
          const w = rfInstance.screenToFlowPosition({ x: e.clientX, y: e.clientY });
          const dx = w.x - it.startWorldX, dy = w.y - it.startWorldY;
          const dir = it.dir;
          let width = it.startWidth, x = it.startX;
          let bodyHeight = it.startBodyHeight, y = it.startY;
          if (dir.includes('e')) {
            width = Math.max(MIN_NODE_WIDTH, snapToGrid(it.startWidth + dx));
          } else if (dir.includes('w')) {
            width = Math.max(MIN_NODE_WIDTH, snapToGrid(it.startWidth - dx));
            x = it.startX + (it.startWidth - width);
          }
          // Snap the delta, not the body: the start height is already
          // grid-aligned as a whole card (gridAlignedBodyHeight), so whole
          // grid steps keep it aligned. minDelta = largest shrink above MIN_BODY_HEIGHT.
          const minDelta = -Math.floor((it.startBodyHeight - MIN_BODY_HEIGHT) / GRID_SIZE) * GRID_SIZE;
          if (dir.includes('s')) {
            bodyHeight = it.startBodyHeight + Math.max(minDelta, snapToGrid(dy));
          } else if (dir.includes('n')) {
            const d = Math.max(minDelta, snapToGrid(-dy));
            bodyHeight = it.startBodyHeight + d;
            y = it.startY - d;
          }
          pending = { id: it.id, width, bodyHeight, x, y };
          if (rafId === null) rafId = requestAnimationFrame(flush);
        }
        function onUp() {
          interactionRef.current = { mode: null };
          if (rafId !== null) { cancelAnimationFrame(rafId); }
          flush();
          resyncAllNodeInternals();
        }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        // Covers focus leaving the window mid-drag with no further mouse event at all.
        window.addEventListener('blur', onUp);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('blur', onUp);
          if (rafId !== null) cancelAnimationFrame(rafId);
        };
      }, [rfInstance, updateNodeInternals, resyncAllNodeInternals]);

      // Delete key — React Flow's own deleteKeyCode is off (see <ReactFlow>
      // props) so this is the one place deletion happens, guarding against
      // eating a Backspace meant for a focused text field.
      useEffect(() => {
        function onKey(e) {
          if (serverState !== 'ok') return;
          if ((e.key === 'Delete' || e.key === 'Backspace') && selection) {
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
            if (selection.type === 'node') deleteNode(selection.id);
            else deleteEdge(selection.id);
            setSelection(null);
          }
        }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [selection, nodes, edges, serverState]);

      function centerFlowPoint() {
        const rect = paneWrapRef.current.getBoundingClientRect();
        const jitter = () => Math.random() * 60 - 30;
        return rfInstance.screenToFlowPosition({ x: rect.left + rect.width / 2 + jitter(), y: rect.top + rect.height / 2 + jitter() });
      }

      function addNode(type) {
        const info = typesByType[type];
        const id = 'n' + (nodeIdRef.current++);
        const c = centerFlowPoint();
        setNodes(prev => ({ ...prev, [id]: { id, type, x: snapToGrid(c.x - NODE_WIDTH / 2), y: snapToGrid(c.y - 40), z: ++zCounterRef.current, bodyHeight: info.defaultBodyHeight, data: JSON.parse(JSON.stringify(info.defaultData || {})) } }));
        setSelection({ type: 'node', id });
      }

      function addTemplateNode(template) {
        const id = 'n' + (nodeIdRef.current++);
        const paramDefs = extractPlaceholders(template.content);
        const values = {};
        paramDefs.forEach(p => { values[p.key] = p.defaultValue; });
        const outputs = (template.outputs || []).map(normalizeOutputField);
        const outputValues = {};
        outputs.forEach(o => { outputValues[o.key] = ''; });
        const c = centerFlowPoint();
        setNodes(prev => ({
          ...prev,
          [id]: {
            id, type: 'template', x: snapToGrid(c.x - NODE_WIDTH / 2), y: snapToGrid(c.y - 40), z: ++zCounterRef.current,
            bodyHeight: TEMPLATE_DEFAULT_BODY_HEIGHT,
            data: { templateId: template.id, title: template.name, content: template.content, values, outputs, outputValues },
          },
        }));
        setSelection({ type: 'node', id });
        setTemplateManagerOpen(false);
      }

      async function saveTemplate(draft) {
        const body = { name: draft.name, content: draft.content, outputs: draft.outputs };
        try {
          const saved = await saveNodeRequest(draft.id, body);
          setTemplates(prev => {
            const exists = prev.some(t => t.id === saved.id);
            return exists ? prev.map(t => t.id === saved.id ? saved : t) : [...prev, saved];
          });
          setTemplatesError(null);
          return saved;
        } catch (e) {
          setTemplatesError(`Failed to save node — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
          return null;
        }
      }

      function deleteTemplate(id) {
        askConfirm('Delete this node? (Nodes already placed from it are not affected.)', async () => {
          try {
            await deleteNodeRequest(id);
            setTemplates(prev => prev.filter(t => t.id !== id));
            setTemplatesError(null);
          } catch (e) {
            setTemplatesError(`Failed to delete node — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
          }
        });
      }

      // After loading a workflow, new nodes/edges must not collide with
      // its ids — bump the counters past whatever it has.
      function bumpIdCountersPastLoaded(loadedNodes, loadedEdges) {
        let maxNode = 0, maxEdge = 0, maxZ = 0;
        Object.keys(loadedNodes || {}).forEach(id => {
          const m = /^n(\d+)$/.exec(id);
          if (m) maxNode = Math.max(maxNode, parseInt(m[1], 10));
          maxZ = Math.max(maxZ, (loadedNodes[id] && loadedNodes[id].z) || 0);
        });
        (loadedEdges || []).forEach(e => {
          const m = /^e(\d+)$/.exec(e.id);
          if (m) maxEdge = Math.max(maxEdge, parseInt(m[1], 10));
        });
        nodeIdRef.current = Math.max(nodeIdRef.current, maxNode + 1);
        edgeIdRef.current = Math.max(edgeIdRef.current, maxEdge + 1);
        zCounterRef.current = Math.max(zCounterRef.current, maxZ + 1);
      }

      async function saveWorkflow(name) {
        const { x, y, zoom } = rfInstance.getViewport();
        const body = { name, nodes, edges, pan: { x, y }, zoom };
        try {
          const saved = await saveWorkflowRequest(currentWorkflowId, body);
          setCurrentWorkflowId(saved.id);
          setCurrentWorkflowName(saved.name);
          setSaveWorkflowOpen(false);
          const entry = { id: saved.id, name: saved.name, node_count: Object.keys(saved.nodes || {}).length };
          setWorkflows(prev => {
            const exists = prev.some(w => w.id === entry.id);
            return exists ? prev.map(w => w.id === entry.id ? entry : w) : [entry, ...prev];
          });
          setWorkflowsError(null);
        } catch (e) {
          notify(`Failed to save workflow — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
        }
      }

      function loadWorkflowList() {
        fetchWorkflowList()
          .then(data => { setWorkflows(data.workflows || []); setWorkflowsError(null); })
          .catch(e => setWorkflowsError(`Could not load workflows — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`));
      }

      function loadWorkflow(id) {
        askConfirm('Load this workflow? This replaces everything currently on the canvas.', async () => {
          try {
            const wf = await fetchWorkflowById(id);
            const loadedNodes = migrateLoadedNodes(wf.nodes || {});
            const loadedEdges = wf.edges || [];
            // Loading never fires anything by itself — Move/Queue side
            // effects only ever happen inside runWorkflow.
            setNodes(loadedNodes);
            setShowWaiting(false);
            // See syncTemplateNodesWithCatalog: loading doesn't change `templates`, so the effect won't run.
            syncTemplateNodesWithCatalog(templates);
            setEdges(loadedEdges);
            rfInstance.setViewport({
              x: wf.pan ? wf.pan.x : 120,
              y: wf.pan ? wf.pan.y : 80,
              zoom: typeof wf.zoom === 'number' ? wf.zoom : 1,
            });
            bumpIdCountersPastLoaded(loadedNodes, loadedEdges);
            setCurrentWorkflowId(wf.id);
            setCurrentWorkflowName(wf.name);
            setSelection(null);
          } catch (e) {
            setWorkflowsError(`Failed to load workflow — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
          }
        }, { confirmLabel: 'Load', confirmColor: 'primary' });
      }

      function deleteWorkflow(id) {
        askConfirm('Delete this saved workflow?', async () => {
          try {
            await deleteWorkflowRequest(id);
            setWorkflows(prev => prev.filter(w => w.id !== id));
            if (currentWorkflowId === id) { setCurrentWorkflowId(null); setCurrentWorkflowName(''); }
          } catch (e) {
            setWorkflowsError(`Failed to delete workflow — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
          }
        });
      }

      // Stable identity (handed to every node as data.onXxx; a new one per render
      // would re-reconcile every node). Reads state via refs/updaters, so [] deps are safe.
      const updateData = useCallback((id, patch) => {
        setNodes(prev => prev[id] ? { ...prev, [id]: { ...prev[id], data: { ...prev[id].data, ...patch } } } : prev);
      }, []);

      // Runs execute server-side; RunClient (common.js) starts/stops them and
      // mirrors their progress through this host. Every callback here is stable.
      const runnerRef = useRef(null);
      if (!runnerRef.current) {
        runnerRef.current = new RunClient({
          getNodes: () => nodesRef.current,
          getEdges: () => edgesRef.current,
          updateData,
          log: (nodeId, message, level) => logEvent(nodeId, message, level),
          notify: message => setToast(message),
          onRunningChange: running => { setIsRunningWorkflow(running); if (running) setShowWaiting(true); },
          onRunBlocked: () => setIssuesDialog({ runBlocked: true }),
          onLiveChange: live => setRunLive(live),
        });
      }
      const runner = runnerRef.current;
      const stopNode = useCallback(nodeId => runnerRef.current.stopNode(nodeId), []);
      const retryNode = useCallback(nodeId => runnerRef.current.retryNode(nodeId), []);

      // A Link node's resolved value is a plain OS path (not a URI) — this
      // asks api_server.py's /open-path to launch Explorer with it directly.
      const openInExplorer = useCallback(async (nodeId, path) => {
        updateData(nodeId, { openError: null });
        try {
          await openPathRequest(path);
        } catch (e) {
          const message = `${e && e.message ? e.message : e}`;
          updateData(nodeId, { openError: message });
          notify(`Failed to open folder: ${message}`);
        }
      }, [updateData]);


      const deleteNode = useCallback(id => {
        setNodes(prev => {
          const n = { ...prev };
          delete n[id];
          return n;
        });
        // Dropping its edges also drops it from any Group/Wrapper (both derive from Ref edges).
        setEdges(prev => prev.filter(e => e.from.node !== id && e.to.node !== id));
      }, []);
      const deleteEdge = useCallback(id => {
        setEdges(prev => prev.filter(e => e.id !== id));
      }, []);
      const deleteEdgesAtPort = useCallback((nodeId, portId) => {
        setEdges(prev => prev.filter(e =>
          !(e.from.node === nodeId && e.from.port === portId) &&
          !(e.to.node === nodeId && e.to.port === portId)
        ));
      }, []);

      const beginResizeNode = useCallback((e, nodeId, dir, renderedBodyHeight) => {
        if (e.button !== 0) return;
        setNodes(prev => prev[nodeId] ? { ...prev, [nodeId]: { ...prev[nodeId], z: ++zCounterRef.current } } : prev);
        setSelection({ type: 'node', id: nodeId });
        const node = nodesRef.current[nodeId];
        const w = rfInstance.screenToFlowPosition({ x: e.clientX, y: e.clientY });
        interactionRef.current = {
          mode: 'resizeNode', id: nodeId, dir,
          startWorldX: w.x, startWorldY: w.y,
          startX: node.x, startY: node.y,
          startWidth: node.width || NODE_WIDTH,
          // The rendered (grid-aligned) height, not the stored one it was rounded from.
          startBodyHeight: renderedBodyHeight,
        };
      }, [rfInstance]);

      function clearAll() {
        askConfirm('Delete all nodes and connections?', () => {
          setNodes({}); setEdges([]); setSelection(null);
          setCurrentWorkflowId(null); setCurrentWorkflowName('');
          setShowWaiting(false);
        }, { confirmLabel: 'Clear All' });
      }

      // Clears every node's run results (each type's reset patch), leaving inputs alone.
      function resetResults() {
        askConfirm('Clear every node’s run results (AI Node output, Gate/Queue/Move/Wrapper status)? Inputs and wiring are left untouched.', () => {
          setNodes(prev => applyResetToNodes(prev, typesByType));
          setShowWaiting(false);
        }, { confirmLabel: 'Reset Results', confirmColor: 'primary' });
      }


      // Re-evaluates (POST /evaluate) EVALUATE_DELAY_MS after a change to any node's
      // type/data or the wiring — never for moves/resizes, which keep `data` as is.
      // Reads the refs when the timer fires, so it always sends the latest canvas;
      // an answer overtaken by a newer request is dropped. A failure marks the server
      // down and retries.
      const evalInputRef = useRef(null);
      const evalTimerRef = useRef(null);
      const evalSeqRef = useRef(0);
      const [evalRetry, setEvalRetry] = useState(0);
      useEffect(() => {
        if (!nodeTypeList.length) return;
        const list = Object.values(nodes);
        const input = { ids: list.map(n => n.id + ':' + n.type), datas: list.map(n => n.data), edges, running: isRunningWorkflow, runState: runner.runState, evalRetry };
        const prev = evalInputRef.current;
        if (prev && prev.edges === input.edges && prev.running === input.running && prev.runState === input.runState
            && prev.evalRetry === input.evalRetry && prev.ids.length === input.ids.length
            && input.ids.every((id, i) => id === prev.ids[i] && input.datas[i] === prev.datas[i])) return;
        evalInputRef.current = input;
        clearTimeout(evalTimerRef.current);
        evalTimerRef.current = setTimeout(async () => {
          const seq = ++evalSeqRef.current;
          try {
            const res = await evaluateRequest(nodesRef.current, edgesRef.current, runnerRef.current.isRunning, runnerRef.current.runState);
            if (seq !== evalSeqRef.current) return;
            // Keep each unchanged node's view object, so its memoized card skips re-rendering.
            setView(prevView => {
              const nodesOut = {};
              Object.keys(res.nodes || {}).forEach(id => {
                const json = JSON.stringify(res.nodes[id]);
                const old = prevView.nodes[id];
                nodesOut[id] = old && old.__json === json ? old : { ...res.nodes[id], __json: json };
              });
              return { nodes: nodesOut, issues: res.issues || [], connected: res.connected || [] };
            });
            setServerState('ok');
          } catch (e) {
            if (seq !== evalSeqRef.current) return;
            setServerState('down');
            setTimeout(() => setEvalRetry(n => n + 1), SERVER_RETRY_MS);
          }
        }, EVALUATE_DELAY_MS);
      }, [nodes, edges, isRunningWorkflow, nodeTypeList, evalRetry]);
      useEffect(() => () => clearTimeout(evalTimerRef.current), []);

      // Live pre-run check (validate_workflow, common.py) for the toolbar chip and
      // per-node header icon; a run is checked again server-side before it starts.
      const issues = view.issues;
      const issueCounts = { error: issues.filter(i => i.level === 'error').length, warning: issues.filter(i => i.level === 'warning').length };
      const issueByNode = useMemo(() => {
        const byId = {};
        issues.forEach(i => {
          if (!i.nodeId) return;
          const entry = byId[i.nodeId] || (byId[i.nodeId] = { lines: [], level: 'warning' });
          entry.lines.push(i.message);
          if (i.level === 'error') entry.level = 'error';
        });
        return byId;
      }, [issues]);

      // Selects a node and pans to it (issue dialog / run history links).
      const focusNode = useCallback(id => {
        const node = nodesRef.current[id];
        if (!node) return;
        setSelection({ type: 'node', id });
        rfInstance.setCenter(node.x + (node.width || NODE_WIDTH) / 2, node.y + HEADER_H * 2, { zoom: rfInstance.getZoom(), duration: 300 });
      }, [rfInstance]);

      // Port dots take the color of what's wired in (most visible on "any" inputs).
      // Keyed "nodeId:portId:in"/"...:out" — an input and an output can share an id.
      // The raw wires right away, plus the server's expansion (each Group member's own port).
      const connectedPorts = useMemo(() => {
        const set = new Set(view.connected);
        edges.forEach(e => {
          set.add(e.from.node + ':' + e.from.port + ':out');
          set.add(e.to.node + ':' + e.to.port + ':in');
        });
        return set;
      }, [view.connected, edges]);

      const nodeList = Object.values(nodes).sort((a, b) => (a.z || 0) - (b.z || 0));

      // React Flow nodes/edges derived each render from nodes/edges (the source of
      // truth); everything needed at render time rides in `data`.
      const rfNodes = nodeList.map(node => {
        // Sized via CSS (data.__width/__bodyHeight). initialWidth/Height only make React
        // Flow show the node (it hides nodes of unknown size) without fighting the CSS.
        const nodeView = view.nodes[node.id];
        const typeInfo = typesByType[node.type];
        const def = nodeView || typeInfo || { inputs: [], outputs: [] };
        const maxRows = Math.max(def.inputs.length, def.outputs.length, 1);
        const initialWidth = node.width || NODE_WIDTH;
        const initialHeight = HEADER_H + maxRows * PORT_ROW_H + (node.bodyHeight || MIN_BODY_HEIGHT) + 16;
        return {
          id: node.id,
          type: 'app',
          position: { x: node.x, y: node.y },
          selected: !!(selection && selection.type === 'node' && selection.id === node.id),
          initialWidth, initialHeight,
          // rfNodes rebuilds fresh via .map() every render, so React Flow
          // never sees the "same reference as last render" it needs to
          // keep a node's handleBounds. Without `measured`, RF discards
          // them and re-triggers ResizeObserver on every node every
          // render — under heavy churn (drag, batch run) that storm can
          // outrun the browser's own ResizeObserver batching and strand
          // some node's edges with nothing to draw from. Reporting our
          // already-known size as `measured` keeps RF's existing bounds;
          // they still only get force-recomputed at the explicit
          // updateNodeInternals sites above, never as a side effect here.
          measured: { width: initialWidth, height: initialHeight },
          data: {
            ...node.data,
            __type: node.type,
            __typeInfo: typeInfo,
            __view: nodeView,
            __width: node.width,
            __bodyHeight: node.bodyHeight,
            __isRunning: !!(nodeView && nodeView.running),
            __isPassed: !!(nodeView && nodeView.passed),
            hasError: !!(nodeView && nodeView.hasError),
            __issueText: issueByNode[node.id] ? issueByNode[node.id].lines.join('\n') : undefined,
            __issueLevel: issueByNode[node.id] ? issueByNode[node.id].level : undefined,
            // Hourglass waiting reasons only once a run has started — an idle,
            // never-run graph stays neutral.
            __waitingText: showWaiting && nodeView && nodeView.waiting.length ? nodeView.waiting.join('\n') : undefined,
            isRunningWorkflow,
            connectedPorts,
            onDataChange: updateData,
            onDelete: deleteNode,
            onPortContextMenu: deleteEdgesAtPort,
            onResizeStart: beginResizeNode,
            onStopNode: stopNode,
            onRetryNode: retryNode,
            onOpenPath: openInExplorer,
          },
        };
      });

      const rfEdges = edges.map(edge => {
        // An edge only exists between two connected ports, so it's always
        // the "connected" color, same as the ports themselves.
        const color = PORT_CONNECTED_COLOR;
        return {
          id: edge.id, type: 'appEdge',
          source: edge.from.node, sourceHandle: edge.from.port,
          target: edge.to.node, targetHandle: edge.to.port,
          selected: !!(selection && selection.type === 'edge' && selection.id === edge.id),
          data: { color, onDelete: deleteEdge },
        };
      });

      // The selected node's edit form: its type's custom form (core Wrapper), else
      // its fields from the view; none (no panel) for a type with nothing to edit.
      const editingView = editingNode ? view.nodes[editingNode.id] : null;
      const editingType = editingNode ? typesByType[editingNode.type] : null;
      const editForm = !editingNode ? null
        : editingType && CUSTOM_EDIT_FORMS[editingType.customForm]
          ? h(CUSTOM_EDIT_FORMS[editingType.customForm], { key: editingNode.id, node: editingNode, updateData, nodes, edges, isRunningWorkflow })
          : editingView && editingView.fields.length
            ? h(FieldsForm, { key: editingNode.id, node: editingNode, fields: editingView.fields, updateData, isRunningWorkflow })
            : null;

      // Controlled mode: React Flow proposes changes (drag/resize/select/
      // remove), we apply them to nodes/edges.
      function flushPendingPositions() {
        positionRafRef.current = null;
        const pending = pendingPositionsRef.current;
        if (pending.size === 0) return;
        pendingPositionsRef.current = new Map();
        setNodes(prev => {
          let next = prev;
          pending.forEach((pos, id) => {
            if (next[id]) next = { ...next, [id]: { ...next[id], x: pos.x, y: pos.y } };
          });
          return next;
        });
      }
      function onNodesChange(changes) {
        changes.forEach(change => {
          if (change.type === 'position' && change.position) {
            const nx = snapToGrid(change.position.x), ny = snapToGrid(change.position.y);
            pendingPositionsRef.current.set(change.id, { x: nx, y: ny });
            // Drag end commits immediately so the final position never
            // waits on a frame that might not come.
            if (change.dragging === false) {
              if (positionRafRef.current !== null) { cancelAnimationFrame(positionRafRef.current); }
              flushPendingPositions();
              resyncAllNodeInternals();
            } else if (positionRafRef.current === null) {
              positionRafRef.current = requestAnimationFrame(flushPendingPositions);
            }
          } else if (change.type === 'select') {
            if (change.selected) setSelection({ type: 'node', id: change.id });
            else setSelection(sel => (sel && sel.type === 'node' && sel.id === change.id) ? null : sel);
          } else if (change.type === 'remove') {
            deleteNode(change.id);
          }
        });
      }
      function onEdgesChange(changes) {
        changes.forEach(change => {
          if (change.type === 'select') {
            if (change.selected) setSelection({ type: 'edge', id: change.id });
            else setSelection(sel => (sel && sel.type === 'edge' && sel.id === change.id) ? null : sel);
          } else if (change.type === 'remove') {
            deleteEdge(change.id);
          }
        });
      }
      // One wire per input port (a new one replaces it), except ports that take
      // several (portAcceptsMultiple): trigger, Gate's compare/value, Queue's inN.
      function onConnect(connection) {
        const { source, sourceHandle, target, targetHandle } = connection;
        if (!source || !target || source === target) return;
        const acceptsMultiple = portAcceptsMultiple(nodes[target], targetHandle, typesByType);
        setEdges(prev => {
          let filtered = acceptsMultiple
            ? prev.filter(ed => !(ed.to.node === target && ed.to.port === targetHandle && ed.from.node === source && ed.from.port === sourceHandle))
            : prev.filter(ed => !(ed.to.node === target && ed.to.port === targetHandle));
          // A Wrapper's Ref links one node — rewiring it drops the previous link.
          if (sourceHandle === WRAPPER_REF_PORT_ID) {
            filtered = filtered.filter(ed => !(ed.from.node === source && ed.from.port === WRAPPER_REF_PORT_ID));
          }
          return [...filtered, { id: 'e' + (edgeIdRef.current++), from: { node: source, port: sourceHandle }, to: { node: target, port: targetHandle } }];
        });
      }

      return h(Box, { sx: { height: '100vh', display: 'flex', flexDirection: 'column' } },
        h(AppBar, { position: 'static', color: 'default', elevation: 1 },
          h(Toolbar, { variant: 'dense', sx: { gap: 1, flexWrap: 'wrap', py: 0.5 } },
            h(Typography, { variant: 'h6', sx: { mr: 1 } }, 'Telar de Ideas'),
            currentWorkflowName && h(Typography, { variant: 'body2', color: 'text.secondary', sx: { mr: 1 } }, `— ${currentWorkflowName}`),
            h(Box, { sx: { flexGrow: 1 } }),
            h(Tooltip, { title: 'Pre-run check — errors block Run' },
              h(Chip, {
                'data-testid': 'issues-chip', size: 'small', clickable: true,
                color: issueCounts.error ? 'error' : issueCounts.warning ? 'warning' : 'success',
                variant: issueCounts.error || issueCounts.warning ? 'filled' : 'outlined',
                label: issueCounts.error || issueCounts.warning
                  ? `${issueCounts.error} error(s) · ${issueCounts.warning} warning(s)`
                  : 'No problems',
                onClick: () => setIssuesDialog({ runBlocked: false }),
              })
            ),
            h(Button, { size: 'small', variant: 'contained', color: 'error', onClick: clearAll }, 'Clear All')
          )
        ),
        h(Box, { sx: { flex: 1, display: 'flex', minHeight: 0, position: 'relative' } },
          !menuOpen && h(Tooltip, { title: 'Add node / open workflows' },
            h(Fab, {
              'data-testid': 'menu-fab', size: 'medium', color: 'primary',
              sx: { position: 'absolute', top: 16, left: 16, zIndex: 6 },
              onClick: () => setMenuOpen(true),
            }, h(Icon, { name: 'Add', size: 24 }))
          ),
          // Floats over the canvas (no reflow) so the viewport doesn't jump on open/close.
          menuOpen && h(Paper, {
            elevation: 6, 'data-testid': 'node-menu',
            sx: {
              position: 'absolute', top: 12, left: 12, width: 360, maxHeight: 'calc(100% - 24px)', zIndex: 6,
              bgcolor: 'grey.50', p: 1.5, display: 'flex', flexDirection: 'column', gap: 1, overflowY: 'auto',
            },
          },
            h(Box, { sx: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
              h(Typography, { variant: 'overline', color: 'text.secondary' }, 'Default Node'),
              h(IconButton, {
                size: 'small', 'aria-label': 'Close menu',
                onClick: () => setMenuOpen(false),
              }, h(Icon, { name: 'Close', size: 16 }))
            ),
            // Default Node: the core's types; Plugin Node: node_plugin/ files in file name order.
            h(NodeTypeButtons, { types: nodeTypeList.filter(t => t.menu && !t.plugin), color: DEFAULT_NODE_COLOR, onAdd: addNode }),
            h(Divider),
            h(Typography, { variant: 'overline', color: 'text.secondary' }, 'Plugin Node'),
            h(NodeTypeButtons, { types: nodeTypeList.filter(t => t.menu && t.plugin), color: PLUGIN_NODE_COLOR, onAdd: addNode }),
            nodeTypeErrors.map(err => h(Typography, { key: err, variant: 'caption', color: 'error' }, `Node type file failed to load — ${err}`)),
            h(Divider),
            h(Typography, { variant: 'overline', color: 'text.secondary' }, 'AI Node'),
            templatesError && h(Typography, { variant: 'caption', color: 'error' }, templatesError),
            (!templatesError && templates.length === 0)
              ? h(Typography, { variant: 'caption', color: 'text.secondary' }, 'No AI nodes yet.')
              : h(Box, { sx: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0.5 } },
                  templates.map(t => h(Box, { key: t.id, sx: { display: 'flex', alignItems: 'center', gap: 0.25, minWidth: 0 } },
                    h(Button, {
                      size: 'small', variant: 'outlined',
                      sx: { color: TEMPLATE_COLOR, borderColor: TEMPLATE_COLOR, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'block' },
                      onClick: () => addTemplateNode(t),
                    }, t.name),
                    h(Tooltip, { title: 'Edit' },
                      h(IconButton, {
                        size: 'small',
                        onClick: () => { setEditTarget(t); setTemplateManagerOpen(true); },
                      }, h(Icon, { name: 'Edit', size: 16 }))
                    ),
                    h(Tooltip, { title: 'Delete' },
                      h(IconButton, {
                        size: 'small', color: 'error',
                        onClick: () => deleteTemplate(t.id),
                      }, h(Icon, { name: 'Close', size: 16 }))
                    )
                  ))
                ),
            h(Button, {
              size: 'small', variant: 'contained', onClick: () => { setEditTarget(null); setTemplateManagerOpen(true); },
              sx: { alignSelf: 'flex-start', bgcolor: TEMPLATE_COLOR, '&:hover': { bgcolor: TEMPLATE_COLOR, filter: 'brightness(0.9)' } },
            }, '+ Create AI Node'),
            h(Divider),
            h(Typography, { variant: 'overline', color: 'text.secondary' }, 'Workflow'),
            workflowsError && h(Typography, { variant: 'caption', color: 'error' }, workflowsError),
            (!workflowsError && workflows.length === 0)
              ? h(Typography, { variant: 'caption', color: 'text.secondary' }, 'No saved workflows yet.')
              : h(Box, { sx: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0.5 } },
                  workflows.map(w => h(Box, { key: w.id, sx: { display: 'flex', alignItems: 'center', gap: 0.25, minWidth: 0 } },
                    h(Tooltip, { title: `${w.node_count} node(s)` },
                      h(Button, {
                        size: 'small', variant: currentWorkflowId === w.id ? 'contained' : 'outlined',
                        sx: currentWorkflowId === w.id
                          ? { flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'block' }
                          : { color: 'text.primary', borderColor: 'divider', flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'block' },
                        onClick: () => loadWorkflow(w.id),
                      }, w.name)
                    ),
                    h(Tooltip, { title: 'Delete' },
                      h(IconButton, {
                        size: 'small', color: 'error',
                        onClick: () => deleteWorkflow(w.id),
                      }, h(Icon, { name: 'Close', size: 16 }))
                    )
                  ))
                ),
            h(Button, {
              size: 'small', variant: 'contained', onClick: () => setSaveWorkflowOpen(true),
              sx: { alignSelf: 'flex-start' },
            }, '+ Save Workflow')
          ),
          h(Box, {
            ref: paneWrapRef,
            sx: { flex: 1, position: 'relative', bgcolor: '#eef1f5' },
          },
            h(ReactFlow, {
              nodes: rfNodes, edges: rfEdges,
              nodeTypes: NODE_TYPES, edgeTypes: EDGE_TYPES,
              onNodesChange, onEdgesChange, onConnect,
              onPaneClick: () => { setSelection(null); setMenuOpen(false); },
              defaultViewport: { x: 120, y: 80, zoom: 1 },
              minZoom: 0.25, maxZoom: 2.5,
              snapToGrid: true, snapGrid: [GRID_SIZE, GRID_SIZE],
              deleteKeyCode: null, multiSelectionKeyCode: null,
              connectionLineStyle: { stroke: PALETTE.grey[500], strokeWidth: 2.5, strokeDasharray: '6 4' },
              proOptions: { hideAttribution: true },
            },
              h(Background, { variant: BackgroundVariant.Dots, gap: GRID_SIZE, size: 1.2, color: '#c7ccd4' })
            ),
            historyOpen && h(RunHistoryPanel, {
              log: runLog,
              onFocusNode: focusNode,
              onClear: () => setRunLog([]),
              onClose: () => setHistoryOpen(false),
            })
          ),
          // Floats over the canvas like the node menu; stops above the run FABs.
          editForm && h(Paper, {
            key: 'edit-panel', elevation: 6, 'data-testid': 'edit-panel',
            sx: {
              position: 'absolute', top: 12, right: 12, width: EDIT_PANEL_WIDTH, maxHeight: 'calc(100% - 100px)', zIndex: 6,
              p: 1.5, display: 'flex', flexDirection: 'column', gap: 1, overflowY: 'auto',
            },
          },
            // Sticky so the title and close button stay put while long forms scroll.
            h(Box, { sx: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: -12, mt: -1.5, pt: 1.5, pb: 0.5, bgcolor: 'background.paper', zIndex: 2 } },
              h(Typography, { variant: 'subtitle2' }, `Edit ${editingView ? editingView.title : editingNode.type}`),
              h(IconButton, {
                size: 'small', 'aria-label': 'Close edit panel',
                onClick: () => setEditPanelClosed(true),
              }, h(Icon, { name: 'Close', size: 16 }))
            ),
            editForm
          )
        ),
        h(TemplateManagerDialog, {
          open: templateManagerOpen,
          editTarget,
          onClose: () => { setTemplateManagerOpen(false); setEditTarget(null); },
          onSave: saveTemplate,
        }),
        h(SaveWorkflowDialog, {
          open: saveWorkflowOpen,
          defaultName: currentWorkflowName,
          onClose: () => setSaveWorkflowOpen(false),
          onSave: saveWorkflow,
        }),
        h(ConfirmDialog, {
          open: !!confirmState,
          message: confirmState && confirmState.message,
          confirmLabel: confirmState && confirmState.confirmLabel,
          confirmColor: confirmState && confirmState.confirmColor,
          onCancel: () => setConfirmState(null),
          onConfirm: () => { const action = confirmState && confirmState.action; setConfirmState(null); if (action) action(); },
        }),
        h(IssuesDialog, {
          open: !!issuesDialog,
          runBlocked: !!(issuesDialog && issuesDialog.runBlocked),
          issues,
          onClose: () => setIssuesDialog(null),
          onFocusNode: id => { setIssuesDialog(null); focusNode(id); },
          onRemoveEdge: deleteEdge,
        }),
        h(Snackbar, {
          open: !!toast, autoHideDuration: 5000, onClose: () => setToast(null),
          anchorOrigin: { vertical: 'bottom', horizontal: 'center' },
        },
          h(Alert, { severity: 'error', onClose: () => setToast(null) }, toast || '')
        ),
        // Covers everything (dialogs too) while api_server.py can't be reached — nothing
        // node-type-specific can be drawn or edited without it.
        serverState !== 'ok' && h(Box, {
          'data-testid': 'server-overlay',
          sx: { position: 'fixed', inset: 0, zIndex: 2000, bgcolor: 'rgba(255,255,255,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        },
          h(Paper, { elevation: 6, sx: { p: 2.5, display: 'flex', alignItems: 'center', gap: 2, maxWidth: 520 } },
            h(CircularProgress, { size: 24 }),
            h(Box, null,
              h(Typography, { variant: 'body2' }, serverState === 'connecting'
                ? `Connecting to api_server.py (${CODEX_API_BASE})…`
                : `Not connected to api_server.py (${CODEX_API_BASE}) — editing is paused until it answers again. Retrying…`),
              // Also shown on GitHub Pages, where the server must run on the viewer's own PC.
              serverState !== 'connecting' && h(Typography, { variant: 'caption', component: 'div', sx: { mt: 1, color: 'text.secondary' } },
                'Start it in the telar-de-ideas folder: uvicorn api_server:app --host 127.0.0.1 --port 9014 (see README.md).'))
          )
        ),
        h(Box, { sx: { position: 'fixed', right: 24, bottom: 24, display: 'flex', gap: 1.5, zIndex: 6 } },
          h(Tooltip, { title: historyOpen ? 'Hide run history' : 'Show run history' },
            h(Fab, {
              'data-testid': 'history-fab', size: 'medium', color: historyOpen ? 'secondary' : 'default',
              onClick: () => setHistoryOpen(o => !o),
            }, h(Icon, { name: 'History', size: 22 }))
          ),
          h(Tooltip, { title: 'Reset every node’s run results (AI Node output, Gate/Queue/Move status) — inputs and wiring are untouched' },
            h('span', null, h(Fab, {
              color: 'default', size: 'medium',
              disabled: isRunningWorkflow,
              onClick: resetResults,
            }, h(Icon, { name: 'Replay', size: 22 })))
          ),
          h(Tooltip, { title: 'Stop the running workflow (and any Delay still counting down)' },
            h('span', null, h(Fab, {
              color: 'error', size: 'medium',
              disabled: !isRunningWorkflow && !runLive,
              onClick: () => runner.stopWorkflow(),
            }, h(Icon, { name: 'Stop', size: 22 })))
          ),
          h(Tooltip, { title: 'Run the workflow (AI Nodes in dependency order, plus any Move/Queue whose inputs are ready)' },
            h('span', null, h(Fab, {
              color: 'primary', size: 'medium',
              // A graph needs a node of a RUNNABLE type (Created Node, Move, Queue —
              // the ones whose effects only happen in a run) for Run to do anything.
              disabled: isRunningWorkflow || !nodeList.some(n => (typesByType[n.type] || {}).runnable),
              onClick: () => runner.runWorkflow(),
            }, isRunningWorkflow ? h(CircularProgress, { size: 22, thickness: 5, color: 'inherit' }) : h(Icon, { name: 'PlayArrow', size: 22 })))
          )
        )
      );
    }

    // FlowApp calls useReactFlow(), which only works inside a provider.
    function App() {
      return h(ThemeProvider, { theme: THEME }, h(ReactFlowProvider, null, h(FlowApp)));
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
