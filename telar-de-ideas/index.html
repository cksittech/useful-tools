<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Telar de Ideas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    /* "Still in progress" card border (AppNode, driven by
       compute_run_states in common.py) — blinks red while a AI Node
       is actively executing, a Gate is still waiting on its compare wires,
       or a Group contains such a node. */
    @keyframes nodeRunningBlink {
      0%, 100% { border-color: #d32f2f; outline-color: #d32f2f; }
      50% { border-color: #ffcdd2; outline-color: #ffcdd2; }
    }
  </style>
  <link rel="stylesheet" href="lib/reactflow.css">
  <script src="lib/react.min.js"></script>
  <script src="lib/react-dom.min.js"></script>
  <script>
    // @xyflow/react's UMD build expects the automatic JSX runtime as a
    // global (no standalone UMD build of react/jsx-runtime exists) — this
    // is a faithful manual jsx/jsxs shim via React.createElement.
    (function () {
      function jsx(type, props, key) {
        const p = props || {};
        if (key !== undefined) p.key = key;
        return React.createElement(type, p);
      }
      window.jsxRuntime = { jsx, jsxs: jsx, Fragment: React.Fragment };
    })();
  </script>
  <script src="lib/reactflow.umd.js"></script>
  <script src="lib/material-ui.min.js"></script>
  <script src="lib/babel.min.js"></script>
  <script src="lib/icons-data.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const {
      Box, AppBar, Toolbar, Typography, Button, IconButton, TextField,
      Select, MenuItem, FormControl, Paper, Divider, Fab, InputAdornment,
      Dialog, DialogTitle, DialogContent, DialogActions, Chip, CircularProgress, LinearProgress,
      Tooltip, Alert, Snackbar, ToggleButton, ToggleButtonGroup, SvgIcon, Link,
      ThemeProvider, createTheme, colors,
    } = MaterialUI;
    // Labels render as written (MUI uppercases by default). Title Case for buttons,
    // toggles, titles and node names; sentence case for labels, captions, tooltips, chips.
    const THEME = createTheme({
      typography: { button: { textTransform: 'none' }, overline: { textTransform: 'none' } },
    });
    // For colors outside sx (React Flow styles, template strings).
    const PALETTE = THEME.palette;
    const {
      ReactFlow, ReactFlowProvider, Background, BackgroundVariant,
      Handle, Position, BaseEdge, EdgeLabelRenderer, getBezierPath,
      useReactFlow, useUpdateNodeInternals,
    } = window.ReactFlow;
    const { useState, useRef, useEffect, useMemo, useCallback } = React;

    // Real Material Design icon paths (same set @mui/icons-material ships),
    // kept as a tiny local data file instead of pulling in the whole
    // icons-material package — see lib/icons-data.js. Each entry is one <path>.
    const ICON_PATHS = Object.fromEntries(window.MUI_ICONS.map(([name, svg]) => [name, svg.match(/ d="([^"]+)"/)[1]]));
    function Icon({ name, size = 20, style }) {
      return <SvgIcon sx={{ fontSize: size, display: 'block' }} style={style}><path d={ICON_PATHS[name]} /></SvgIcon>;
    }

    // A row's connection dot over React Flow's <Handle> (which owns connecting);
    // `top` = the row's vertical center.
    function PortHandle(props) {
      const { nodeId, port, isOutput, top, colorOverride, onContextMenu } = props;
      const color = colorOverride || PORT_UNCONNECTED_COLOR;
      return <Handle
        type={isOutput ? 'source' : 'target'}
        position={isOutput ? Position.Right : Position.Left}
        id={port.id}
        onContextMenu={e => { e.preventDefault(); e.stopPropagation(); onContextMenu && onContextMenu(nodeId, port.id); }}
        style={{
          top, width: DOT_SIZE, height: DOT_SIZE, borderRadius: '50%',
          background: color, border: `2px solid ${PALETTE.common.white}`, boxShadow: '0 0 0 1px rgba(0,0,0,0.25)',
          pointerEvents: 'all', cursor: isOutput ? 'crosshair' : 'default',
        }} />;
    }

    // Small square colored Button for header actions (stop/retry/delete/view).
    function HeaderActionButton(props) {
      const { color, variant, disabled, onClick, title, children } = props;
      const btn = <Button
        size="small" color={color} variant={variant || 'contained'} disabled={disabled}
        className="nodrag"
        onMouseDown={e => e.stopPropagation()}
        onClick={e => { e.stopPropagation(); onClick(); }}
        sx={{
          minWidth: 24, width: 24, height: 22, p: 0, fontSize: 12, lineHeight: 1, boxShadow: 'none', '&:hover': { boxShadow: 'none' },
          // A disabled contained button's default dark fill nearly
          // vanishes against these colored headers — fade to a light
          // translucent chip instead.
          '&.Mui-disabled': { bgcolor: 'rgba(255,255,255,0.25)', color: 'rgba(255,255,255,0.65)' },
        }}>{children}</Button>;
      // Tooltip needs a ref-forwarding child; a disabled Button won't fire
      // hover events, so wrap it in a span when disabled.
      return <Tooltip title={title}>{disabled ? <span>{btn}</span> : btn}</Tooltip>;
    }

    // Shows exactly what was sent to Codex (prompt + output schema) and
    // what came back, for whichever template node is open.
    function NodeDetailDialog(props) {
      const { open, node, onClose } = props;
      const req = node && node.data.lastRequest;
      const res = node && node.data.lastResponse;
      const prev = node && node.data.previousRun;
      const isRunning = node && (node.data.runStatus === 'running' || node.data.runStatus === 'starting');
      return <Dialog open={open} onClose={onClose} maxWidth="sm" fullWidth={true}>
        <DialogTitle>Node Details</DialogTitle>
        <DialogContent dividers={true}>
          <Typography variant="overline" color="text.secondary" sx={{ display: 'block' }}>Request</Typography>
          {req
            ? <Box sx={{ mb: 2 }}>
                <Typography variant="body2" sx={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word', mb: req.outputSchema ? 1 : 0 }}>{req.prompt}</Typography>
                {req.outputSchema && <Box sx={{ bgcolor: 'grey.100', borderRadius: 1, p: 1 }}>
                  <Typography variant="caption" color="text.secondary" sx={{ display: 'block', mb: 0.5 }}>Output Schema</Typography>
                  <Typography
                    variant="body2" component="pre"
                    sx={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word', m: 0, fontFamily: 'monospace', fontSize: 12 }}>{JSON.stringify(req.outputSchema, null, 2)}</Typography>
                </Box>}
            </Box>
            : <Typography variant="body2" color="text.secondary" sx={{ mb: 2 }}>(not run yet)</Typography>}
          <Typography variant="overline" color="text.secondary" sx={{ display: 'block' }}>Response</Typography>
          {isRunning
            ? <LinearProgress sx={{ mt: 1 }} />
            : <Typography
                variant="body2" component="pre"
                sx={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word', m: 0, fontFamily: 'monospace', fontSize: 12 }}>{(res && res.raw) || '(no response)'}</Typography>}
          {/* The attempt before the latest one (e.g. the run a Wrapper retry replaced). */}
          {prev && <Box sx={{ mt: 2, pt: 1, borderTop: '1px solid', borderColor: 'divider' }}>
            <Typography variant="overline" color="text.secondary" sx={{ display: 'block' }}>Previous Response</Typography>
            <Typography variant="caption" color={prev.runStatus === 'done' ? 'text.secondary' : 'error'} sx={{ display: 'block', mb: 0.5 }}>
              {[prev.runStatus || 'unknown', prev.response && prev.response.threadId, prev.runError].filter(Boolean).join(' · ')}
            </Typography>
            <Typography
              variant="body2" component="pre"
              sx={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word', m: 0, fontFamily: 'monospace', fontSize: 12 }}>{(prev.response && prev.response.raw) || '(no response)'}</Typography>
          </Box>}
        </DialogContent>
        <DialogActions><Button onClick={onClose}>Close</Button></DialogActions>
      </Dialog>;
    }

    // Shared "one-line error message" look — every node type's transient
    // failure text renders identically instead of each inventing its own
    // Typography/color/truncation combo.
    function ErrorText({ children }) {
      return <Typography variant="caption" color="error" sx={{ wordBreak: 'break-all' }}>{children}</Typography>;
    }

    // Shared vertical layout for multi-control bodies.
    function BodyStack({ children }) {
      return <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1 }}>{children}</Box>;
    }

    // ---- Card body widgets ----
    // A node's body is a list of widgets its type's body(node, view) returns
    // (POST /evaluate; see common.py "Node types"). Unknown kinds render nothing.
    const CAPTION_COLORS = { error: 'error', success: 'success.main' };
    const DARK_BOX_SX = { bgcolor: 'grey.900', color: 'common.white', borderRadius: 1, p: 1, wordBreak: 'break-all', fontFamily: 'monospace', fontSize: 13 };

    function chipOf(w, key) {
      return <Chip
        key={key} size="small" color={w.color || 'default'} variant={w.variant || 'filled'} label={w.label}
        sx={{ alignSelf: 'flex-start' }}
        icon={w.icon ? <Icon name={w.icon} size={16} style={{ color: 'inherit' }} /> : undefined} />;
    }

    const BODY_WIDGETS = {
      caption: w => <Typography variant="caption" color={CAPTION_COLORS[w.color] || 'text.secondary'}>{w.text}</Typography>,
      chip: w => chipOf(w),
      chips: w => <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.5 }}>
        {(w.items || []).length
          ? w.items.map((c, i) => chipOf(c, i))
          : w.empty && <Typography variant="caption" color="text.secondary">{w.empty}</Typography>}
      </Box>,
      value: w => <Box sx={{ ...DARK_BOX_SX, minHeight: 40 }}>{w.text}</Box>,
      pairs: w => <Box sx={{ ...DARK_BOX_SX, display: 'flex', flexDirection: 'column', gap: 0.5 }}>
        {(w.rows || []).map((r, i) => <Box key={i}>
          <Box component="span" sx={{ color: colors.blue[200] }}>{`${r.name}: `}</Box>{r.value}
        </Box>)}
      </Box>,
      path: w => <Box sx={{ bgcolor: 'grey.100', borderRadius: 1, p: 1, wordBreak: 'break-all' }}>
        {w.text === undefined
          ? <Typography variant="caption" color="text.secondary">{w.empty}</Typography>
          : <Typography variant="caption" sx={{ fontFamily: 'monospace', wordBreak: 'break-all' }}>{w.text}</Typography>}
      </Box>,
      open: (w, { id, data }) => <Button
        size="small" variant="outlined" className="nodrag"
        onClick={() => data.onOpenPath(id, w.path)}>{w.label}</Button>,
      error: w => <ErrorText>{w.text}</ErrorText>,
      alert: w => <Alert severity={w.severity || 'error'} variant="outlined" sx={{ py: 0 }}>{w.text}</Alert>,
    };

    function WidgetBody({ widgets, id, data }) {
      if (!widgets || !widgets.length) return null;
      return <BodyStack>{widgets.map((w, i) => {
        const render = BODY_WIDGETS[w.kind];
        return render ? <React.Fragment key={i}>{render(w, { id, data })}</React.Fragment> : null;
      })}</BodyStack>;
    }

    // ---- Edit-panel fields ----
    // The right-side panel's form for the selected node: its type's FIELDS /
    // fields(node) widgets (POST /evaluate). Values always come from the local
    // node data (so typing never waits on the server); edits apply immediately.
    function FieldControl({ field, value, onChange, disabled, autoFocus }) {
      const common = { size: 'small', fullWidth: true, variant: 'outlined', disabled, autoFocus };
      switch (field.kind) {
        case 'text':
          return <TextField
            {...common} label={field.label} placeholder={field.placeholder} helperText={field.helper}
            multiline={!!field.multiline} minRows={field.multiline ? (field.rows || 1) : undefined}
            value={value ?? ''} onChange={e => onChange(e.target.value)} />;
        case 'number':
          return <TextField
            {...common} label={field.label} type="number" helperText={field.helper}
            value={value ?? field.default ?? ''} onChange={e => onChange(numberFieldValue(field, e.target.value))} />;
        case 'select':
          return <FormControl size="small" fullWidth={true} disabled={disabled}>
            <Select value={value ?? field.default ?? ''} onChange={e => onChange(e.target.value)}>
              {(field.options || []).map(o => <MenuItem key={String(o.value)} value={o.value}>{o.label}</MenuItem>)}
            </Select>
          </FormControl>;
        case 'toggle':
          return <ToggleButtonGroup
            size="small" exclusive={true} disabled={disabled} value={value ?? field.default ?? null}
            onChange={(e, next) => { if (next !== null) onChange(next); }}>{(field.options || []).map(o => <ToggleButton key={String(o.value)} value={o.value}>{o.label}</ToggleButton>)}</ToggleButtonGroup>;
        default:
          return null;
      }
    }

    // A list of strings (keepOne: never empty — removing the last row blanks it).
    function ListField({ field, value, onChange, disabled }) {
      const list = Array.isArray(value) && value.length ? value : (field.keepOne ? [''] : []);
      const set = next => onChange(next.length || !field.keepOne ? next : ['']);
      return <BodyStack>
        {list.map((v, i) => <Box key={i} sx={{ display: 'flex', alignItems: 'center', gap: 0.5 }}>
          <TextField
            size="small" variant="outlined" fullWidth={true} disabled={disabled} placeholder={field.placeholder}
            value={v} onChange={e => set(list.map((val, j) => (j === i ? e.target.value : val)))} />
          <IconButton size="small" disabled={disabled || (field.keepOne && list.length <= 1)} onClick={() => set(list.filter((_, j) => j !== i))}>
            <Icon name="Close" size={14} />
          </IconButton>
        </Box>)}
        <Button size="small" variant="outlined" disabled={disabled} onClick={() => set([...list, ''])}>{field.addLabel || '+ Add'}</Button>
      </BodyStack>;
    }

    // A list of objects, one bordered box of sub-fields each (the first one gets the remove button).
    function RecordsField({ field, value, onChange, disabled }) {
      const list = Array.isArray(value) ? value : [];
      const setAt = (i, patch) => onChange(list.map((r, j) => (j === i ? { ...r, ...patch } : r)));
      return <BodyStack>
        {list.map((rec, i) => <Box key={i} sx={{ display: 'flex', flexDirection: 'column', gap: 1, p: 1, border: 1, borderColor: 'divider', borderRadius: 1 }}>
          {(field.fields || []).map((sub, k) => {
            const control = <FieldControl
              field={sub} value={(rec || {})[sub.key]} disabled={disabled} onChange={v => setAt(i, { [sub.key]: v })} />;
            return k > 0 ? <React.Fragment key={k}>{control}</React.Fragment> : <Box key={k} sx={{ display: 'flex', alignItems: 'center', gap: 0.5 }}>
              {control}
              <IconButton size="small" disabled={disabled} onClick={() => onChange(list.filter((_, j) => j !== i))}><Icon name="Close" size={14} /></IconButton>
            </Box>;
          })}
        </Box>)}
        <Button
          size="small" variant="outlined" disabled={disabled}
          onClick={() => onChange([...list, JSON.parse(JSON.stringify(field.newItem || {}))])}>{field.addLabel || '+ Add'}</Button>
      </BodyStack>;
    }

    function FieldsForm({ node, fields, updateData, isRunningWorkflow }) {
      const disabled = isRunningWorkflow;
      let focused = false;
      return <BodyStack>{fields.map((field, i) => {
        if (field.kind === 'caption') {
          return <Typography key={i} variant="caption" color="text.secondary">{field.text}</Typography>;
        }
        if (field.kind === 'button') {
          return <Button
            key={i} size="small" variant="outlined" color={field.color || 'primary'} disabled={disabled}
            onClick={() => {
              const patch = JSON.parse(JSON.stringify(field.set || {}));
              (field.unset || []).forEach(k => { patch[k] = undefined; });
              updateData(node.id, patch);
            }}>{field.label}</Button>;
        }
        const props = {
          key: i, field, disabled, value: node.data[field.key],
          onChange: v => updateData(node.id, fieldPatch(field, v)),
        };
        if (field.kind === 'list') return <ListField {...props} />;
        if (field.kind === 'records') return <RecordsField {...props} />;
        // The first plain input gets the focus when the panel opens.
        const autoFocus = !focused && (field.kind === 'text' || field.kind === 'number');
        if (autoFocus) focused = true;
        return <FieldControl {...props} autoFocus={autoFocus} />;
      })}</BodyStack>;
    }

    // Wrapper (core type, CUSTOM_FORM "wrapper"): condition groups appear once a
    // AI Node is linked (conditions use its output fields). Groups are OR'd,
    // rows within a group AND'd. `edges` resolves the link.
    function WrapperEditForm({ node, updateData, nodes, edges, isRunningWorkflow }) {
      const linkedId = wrapperLinkedNodeId(node.id, edges);
      const linkedNode = linkedId ? nodes[linkedId] : null;
      const outputFields = linkedNode ? (linkedNode.data.outputs || []) : [];
      const groups = node.data.conditionGroups || [];

      function setGroups(next) { updateData(node.id, { conditionGroups: next }); }
      function updateCond(gi, ci, patch) {
        setGroups(groups.map((g, i) => i !== gi ? g : g.map((c, j) => j !== ci ? c : { ...c, ...patch })));
      }
      function addCond(gi) {
        if (!outputFields.length) return;
        setGroups(groups.map((g, i) => i !== gi ? g : [...g, { key: outputFields[0].key, op: 'eq', value: '' }]));
      }
      function removeCond(gi, ci) {
        setGroups(groups.map((g, i) => i !== gi ? g : g.filter((_, j) => j !== ci)));
      }
      function addGroup() {
        setGroups([...groups, outputFields.length ? [{ key: outputFields[0].key, op: 'eq', value: '' }] : []]);
      }
      function removeGroup(gi) {
        setGroups(groups.filter((_, i) => i !== gi));
      }

      return <BodyStack>
        <RetriesField
          disabled={isRunningWorkflow}
          value={node.data.maxRetries != null ? node.data.maxRetries : 3}
          onChange={v => updateData(node.id, { maxRetries: v })} />
        {!linkedNode
          ? <Typography variant="caption" color="text.secondary">
              Link an AI Node via the Ref dot below to set output conditions.
          </Typography>
          : outputFields.length === 0
            ? <Typography variant="caption" color="text.secondary">(linked node defines no outputs)</Typography>
            : <BodyStack>
                {groups.length === 0 && <Typography variant="caption" color="text.secondary">
                  No conditions — always considered passed.
                </Typography>}
                {groups.map((group, gi) => <Box
                  key={gi}
                  sx={{ border: '1px solid', borderColor: 'divider', borderRadius: 1, p: 0.75, display: 'flex', flexDirection: 'column', gap: 0.5 }}>
                  {gi > 0 && <Typography variant="caption" color="text.secondary" sx={{ fontWeight: 'bold' }}>OR</Typography>}
                  {group.map((cond, ci) => <Box key={ci} sx={{ display: 'flex', alignItems: 'center', gap: 0.5 }}>
                    <Select
                      size="small" value={cond.key} disabled={isRunningWorkflow} sx={{ minWidth: 0, flex: 1 }}
                      onChange={e => updateCond(gi, ci, { key: e.target.value })}>
                      {outputFields.map(o => <MenuItem key={o.key} value={o.key}>{o.name || o.key}</MenuItem>)}
                    </Select>
                    {/* Σ: compare the sum over this Wrapper's attempts (first run + retries). */}
                    <Tooltip title={cond.total ? 'Comparing the total across attempts' : 'Comparing this attempt\'s value (click for the total)'}>
                      <ToggleButton
                        value="total" size="small" selected={!!cond.total} disabled={isRunningWorkflow}
                        sx={{ px: 0.75, py: 0.25, minWidth: 0 }}
                        onChange={() => updateCond(gi, ci, { total: !cond.total })}>Σ</ToggleButton>
                    </Tooltip>
                    <Select
                      size="small" value={cond.op} disabled={isRunningWorkflow} sx={{ minWidth: 56 }}
                      onChange={e => updateCond(gi, ci, { op: e.target.value })}>
                      {WRAPPER_CONDITION_OPS.map(op => <MenuItem key={op} value={op}>{WRAPPER_OP_LABELS[op]}</MenuItem>)}
                    </Select>
                    <TextField
                      size="small" variant="outlined" disabled={isRunningWorkflow} sx={{ flex: 1, minWidth: 0 }}
                      placeholder={(cond.op === 'eq' || cond.op === 'neq') ? 'value(s), comma-separated' : 'number'}
                      value={cond.value} onChange={e => updateCond(gi, ci, { value: e.target.value })} />
                    <IconButton size="small" disabled={isRunningWorkflow} onClick={() => removeCond(gi, ci)}>
                      <Icon name="Close" size={14} />
                    </IconButton>
                  </Box>)}
                  <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <Button size="small" disabled={isRunningWorkflow} onClick={() => addCond(gi)}>+ AND Condition</Button>
                    <Button size="small" color="error" disabled={isRunningWorkflow} onClick={() => removeGroup(gi)}>Remove Group</Button>
                  </Box>
                </Box>)}
                <Button size="small" variant="outlined" disabled={isRunningWorkflow} onClick={addGroup}>+ OR Group</Button>
            </BodyStack>}
      </BodyStack>;
    }

    // CUSTOM_FORM name -> edit form, for core types whose form needs other nodes.
    const CUSTOM_EDIT_FORMS = { wrapper: WrapperEditForm };

    // The one node component for every type (React Flow type "app"; the node's own
    // type is data.__type). Ports/body come from POST /evaluate (data.__view), before
    // its first answer from the type's static ports (data.__typeInfo). React Flow owns
    // drag/pan/zoom/connect; resizing is hand-rolled (NodeResizer's full-length strips
    // would cover the side ports).
    function AppNode(props) {
      const { id, data, selected } = props;
      const type = data.__type;
      const node = { id, type, data };
      const isRunning = data.runStatus === 'running' || data.runStatus === 'starting';
      // Border state, computed in FlowApp's runStatesById (needs sibling nodes).
      const isCardRunning = !!data.__isRunning;
      const isCardPassed = !!data.__isPassed;
      const canRetry = type === 'template' && !isRunning && !data.isRunningWorkflow;
      const [detailOpen, setDetailOpen] = useState(false);
      const nodeWidth = data.__width || NODE_WIDTH;
      const def = data.__view || data.__typeInfo || { title: type, inputs: [], outputs: [] };
      const maxRows = Math.max(def.inputs.length, def.outputs.length, 1);
      const rowsBottom = HEADER_H + maxRows * PORT_ROW_H;
      const updateNodeInternals = useUpdateNodeInternals();
      // Ports come from the node's data (and arrive from the server after the
      // static fallback) — their ids/count can change without the box resizing;
      // force React Flow to re-measure handles whenever they do.
      const portKey = def.inputs.map(p => p.id).join('|') + '>' + def.outputs.map(p => p.id).join('|');
      useEffect(() => { updateNodeInternals(id); }, [id, portKey, updateNodeInternals]);

      const rows = [];
      for (let i = 0; i < maxRows; i++) {
        const inp = def.inputs[i];
        const out = def.outputs[i];
        const top = HEADER_H + i * PORT_ROW_H + PORT_ROW_H / 2;
        rows.push(<Box key={i} sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: PORT_ROW_H }}>
          {inp
            ? <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, pl: '4px' }}>
                <PortHandle
                  nodeId={id} port={inp} isOutput={false} top={top} onContextMenu={data.onPortContextMenu}
                  colorOverride={data.connectedPorts && data.connectedPorts.has(id + ':' + inp.id + ':in')
                    ? PORT_CONNECTED_COLOR : PORT_UNCONNECTED_COLOR} />
                <Typography variant="caption" color="text.secondary" sx={{ pl: 1.5 }}>{inp.label}</Typography>
            </Box>
            : <Box />}
          {out
            ? <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, pr: '4px' }}>
                <Typography
                  variant="caption"
                  // The default thread_id output is called out visually
                  // (blue, uppercase) to set it apart from user-defined outputs.
                  color={out.id === THREAD_ID_OUTPUT_KEY ? 'primary.main' : 'text.secondary'}
                  sx={{
                    pr: 1.5,
                    ...(out.id === THREAD_ID_OUTPUT_KEY ? { textTransform: 'uppercase', fontWeight: 'bold' } : null),
                  }}>{out.label}</Typography>
                <PortHandle
                  nodeId={id} port={out} isOutput={true} top={top} onContextMenu={data.onPortContextMenu}
                  colorOverride={out.type === 'trigger' ? TRIGGER_COLOR
                    : (data.connectedPorts && data.connectedPorts.has(id + ':' + out.id + ':out')
                        ? PORT_CONNECTED_COLOR : PORT_UNCONNECTED_COLOR)} />
            </Box>
            : <Box />}
        </Box>);
      }

      const body = <WidgetBody widgets={data.__view && data.__view.body} id={id} data={data} />;

      const cardEl = <Paper
        elevation={selected ? 6 : 2}
        sx={{
          // border-box + a fixed-width border keep the outer size exactly
          // nodeWidth x grid-aligned height in every state; the thicker
          // running/passed ring is an outline, which takes no layout space.
          width: nodeWidth, position: 'relative', boxSizing: 'border-box',
          border: `${NODE_BORDER}px solid`,
          borderColor: isCardRunning ? 'error.main' : isCardPassed ? 'success.main' : selected ? 'primary.main' : 'transparent',
          outline: isCardRunning ? `2px solid ${PALETTE.error.main}` : isCardPassed ? `2px solid ${PALETTE.success.main}` : 'none',
          borderRadius: '10px',
          userSelect: 'none',
          animation: isCardRunning ? 'nodeRunningBlink 1s ease-in-out infinite' : 'none',
        }}>
        {/* Trigger dot. On a Wrapper it only lets a Group's Ref port make it a member — */}
        {/* a Wrapper itself is never run or gated. */}
        {(type === 'template' || type === 'wrapper') && <Handle
          type="target" position={Position.Top} id={TRIGGER_PORT_ID}
          onContextMenu={e => { e.preventDefault(); e.stopPropagation(); data.onPortContextMenu(id, TRIGGER_PORT_ID); }}
          style={{
            width: DOT_SIZE, height: DOT_SIZE, borderRadius: '50%',
            background: (data.connectedPorts && data.connectedPorts.has(id + ':' + TRIGGER_PORT_ID + ':in')) ? TRIGGER_COLOR : PORT_UNCONNECTED_COLOR,
            border: `2px solid ${PALETTE.common.white}`, boxShadow: '0 0 0 1px rgba(0,0,0,0.25)',
            // zIndex above the invisible n/s resize strips below (both are
            // position:absolute with no z-index of their own) — without
            // this, whichever renders later in the DOM wins the hit-test
            // for the strip's dead-center overlap with this dot, and a
            // drag started from dead-center resizes the node instead of
            // starting a connection.
            pointerEvents: 'all', cursor: 'default', top: -1, zIndex: 2,
          }} />}
        {/* Group's Ref dot (membership, no signal) — at the bottom so it doesn't read as a trigger input. */}
        {type === 'group' && <Handle
          type="source" position={Position.Bottom} id={GROUP_REF_PORT_ID}
          onContextMenu={e => { e.preventDefault(); e.stopPropagation(); data.onPortContextMenu(id, GROUP_REF_PORT_ID); }}
          style={{
            width: DOT_SIZE, height: DOT_SIZE, borderRadius: '50%',
            background: (data.connectedPorts && data.connectedPorts.has(id + ':' + GROUP_REF_PORT_ID + ':out')) ? GROUP_REF_COLOR : PORT_UNCONNECTED_COLOR,
            border: `2px solid ${PALETTE.common.white}`, boxShadow: '0 0 0 1px rgba(0,0,0,0.25)',
            pointerEvents: 'all', cursor: 'default', bottom: -1, zIndex: 2,
          }} />}
        {/* Wrapper's linking control — same idea as Group's Ref dot, just */}
        {/* 1:1 (see wrapperLinkedNodeId, common.js) instead of many. */}
        {type === 'wrapper' && <Handle
          type="source" position={Position.Bottom} id={WRAPPER_REF_PORT_ID}
          onContextMenu={e => { e.preventDefault(); e.stopPropagation(); data.onPortContextMenu(id, WRAPPER_REF_PORT_ID); }}
          style={{
            width: DOT_SIZE, height: DOT_SIZE, borderRadius: '50%',
            background: (data.connectedPorts && data.connectedPorts.has(id + ':' + WRAPPER_REF_PORT_ID + ':out')) ? WRAPPER_REF_COLOR : PORT_UNCONNECTED_COLOR,
            border: `2px solid ${PALETTE.common.white}`, boxShadow: '0 0 0 1px rgba(0,0,0,0.25)',
            pointerEvents: 'all', cursor: 'default', bottom: -1, zIndex: 2,
          }} />}
        <Box
          sx={{ height: HEADER_H, bgcolor: (data.__typeInfo && data.__typeInfo.color) || 'grey.500', display: 'flex', alignItems: 'center', justifyContent: 'space-between', px: 1, borderTopLeftRadius: '8px', borderTopRightRadius: '8px' }}>
          <Typography
            variant="body2"
            sx={{ color: 'common.white', fontWeight: 'bold', flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
            {def.title}
            {data.threadId && [
              ' (',
              <Link
                key="tid" component="span" color="inherit" underline="always"
                className="nodrag"
                onMouseDown={e => e.stopPropagation()}
                onClick={e => { e.stopPropagation(); data.onOpenPath(id, GENERATED_IMAGES_DIR + data.threadId); }}
                sx={{ cursor: 'pointer' }}>{data.threadId}</Link>,
              ')',
            ]}
            {data.hasError ? ' ⚠' : ''}
          </Typography>
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, flexShrink: 0 }}>
            {/* Pre-run check result / waiting reasons — plain strings (not */}
            {/* arrays) so nodePropsEqual's reference check stays cheap. */}
            {data.__issueText && <Tooltip title={<Box component="span" sx={{ whiteSpace: 'pre-line' }}>{data.__issueText}</Box>}>
              <Box data-testid="node-issue" sx={{ color: data.__issueLevel === 'error' ? 'common.white' : colors.yellow[200], display: 'flex' }}>
                <Icon name={data.__issueLevel === 'error' ? 'Error' : 'Warning'} size={16} />
              </Box>
            </Tooltip>}
            {data.__waitingText && <Tooltip title={<Box component="span" sx={{ whiteSpace: 'pre-line' }}>{data.__waitingText}</Box>}>
              <Box data-testid="node-waiting" sx={{ color: 'common.white', display: 'flex' }}>
                <Icon name="HourglassEmpty" size={16} />
              </Box>
            </Tooltip>}
            {type === 'template' && <HeaderActionButton
              color="info" title={'View request & response'}
              onClick={() => setDetailOpen(true)}><Icon name="Search" size={14} /></HeaderActionButton>}
            {type === 'template' && <HeaderActionButton
              color="error" disabled={!isRunning}
              onClick={() => data.onStopNode(id)} title="Stop"><Icon name="Stop" size={14} /></HeaderActionButton>}
            {type === 'template' && <HeaderActionButton
              color="primary" disabled={!canRetry}
              onClick={() => data.onRetryNode(id)} title="Retry"><Icon name="Replay" size={14} /></HeaderActionButton>}
            <HeaderActionButton
              color="error"
              onClick={() => data.onDelete(id)} title="Delete"><Icon name="Close" size={14} /></HeaderActionButton>
          </Box>
        </Box>
        <Box sx={{ px: 0 }}>{rows}</Box>
        <Box
          sx={{
            p: 1, display: 'flex', flexDirection: 'column',
            // Fixed, state-driven height (never CSS 'auto') — letting box
            // size passively track DOM content meant a batch of
            // near-simultaneous content changes (many nodes finishing at
            // once) could outrun React Flow's own ResizeObserver and
            // permanently strand some node's edges with no path to draw.
            // Height only ever changes via the resize-drag handle; the body
            // itself scrolls (overflow: auto below) if its content overflows.
            height: gridAlignedBodyHeight(data.__bodyHeight, maxRows),
            overflow: 'auto',
          }}>{body}</Box>
        {/* Always mounted at a fixed height (only the bar itself toggles) */}
        {/* for the same reason as the body box above — popping this in/out */}
        {/* on runStatus changes was its own way for height to change */}
        {/* unexpectedly during a batch run. */}
        <Box sx={{ height: 4, borderRadius: 1, mx: 1, mb: `${NODE_FOOTER_H - 4}px` }}>
          {data.runStatus === 'running' && <LinearProgress sx={{ height: 4, borderRadius: 1 }} />}
        </Box>
        {makeResizeHandles(rowsBottom).map(rh => <Box
          key={rh.dir}
          className="nodrag nopan"
          onMouseDown={e => {
            e.stopPropagation();
            data.onResizeStart(e, id, rh.dir, gridAlignedBodyHeight(data.__bodyHeight, maxRows));
          }}
          sx={{ position: 'absolute', cursor: rh.cursor, ...rh.sx }} />)}
      </Paper>;
      return <React.Fragment>
        {cardEl}
        {type === 'template' && <NodeDetailDialog open={detailOpen} node={node} onClose={() => setDetailOpen(false)} />}
      </React.Fragment>;
    }

    // rfNodes builds a new `data` each render; comparing its keys by reference lets
    // React.memo skip nodes whose values didn't change (e.g. while dragging another).
    function nodePropsEqual(prev, next) {
      // Position isn't a prop here — React Flow moves the wrapper element
      // itself via CSS transform, outside AppNode's render.
      if (prev.id !== next.id || prev.type !== next.type || prev.selected !== next.selected) return false;
      const pd = prev.data, nd = next.data;
      const pk = Object.keys(pd), nk = Object.keys(nd);
      if (pk.length !== nk.length) return false;
      return pk.every(k => pd[k] === nd[k]);
    }
    const MemoizedAppNode = React.memo(AppNode, nodePropsEqual);

    // One React Flow type for every node (node types are only known at run time,
    // from the server). Module scope, so the reference identity never changes.
    const NODE_TYPES = { app: MemoizedAppNode };

    // Custom edge so a selected connection keeps the "click the red dot to
    // delete" affordance — React Flow's default edge only offers click-to-select.
    function AppEdge(props) {
      const { id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, selected, data, markerEnd, style } = props;
      const [edgePath, labelX, labelY] = getBezierPath({ sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition });
      const color = selected ? PALETTE.error.main : (data && data.color) || PALETTE.grey[500];
      return <React.Fragment>
        <BaseEdge id={id} path={edgePath} markerEnd={markerEnd} style={{ ...style, stroke: color, strokeWidth: selected ? 3.5 : 2.5 }} interactionWidth={20} />
        {selected && <EdgeLabelRenderer>
          <IconButton
            className="nodrag nopan" aria-label="Delete connection"
            onClick={e => { e.stopPropagation(); data.onDelete(id); }}
            sx={{
              position: 'absolute', transform: `translate(-50%, -50%) translate(${labelX}px, ${labelY}px)`,
              pointerEvents: 'all', width: 18, height: 18, p: 0,
              bgcolor: 'error.main', color: 'common.white', border: '2px solid', borderColor: 'common.white',
              '&:hover': { bgcolor: 'error.dark' },
            }}><Icon name="Close" size={10} /></IconButton>
        </EdgeLabelRenderer>}
      </React.Fragment>;
    }
    function edgePropsEqual(prev, next) {
      if (prev.selected !== next.selected) return false;
      if (prev.sourceX !== next.sourceX || prev.sourceY !== next.sourceY) return false;
      if (prev.targetX !== next.targetX || prev.targetY !== next.targetY) return false;
      const pd = prev.data, nd = next.data;
      return pd.color === nd.color && pd.onDelete === nd.onDelete;
    }
    const EDGE_TYPES = { appEdge: React.memo(AppEdge, edgePropsEqual) };

    function EnumValuesEditor(props) {
      const { values, onChange } = props;
      const list = values && values.length ? values : [''];
      function updateAt(i, v) { const next = [...list]; next[i] = v; onChange(next); }
      function removeAt(i) { const next = list.filter((_, idx) => idx !== i); onChange(next.length ? next : ['']); }
      return <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.75 }}>
        {list.map((v, i) => <Box key={i} sx={{ display: 'flex', gap: 1, alignItems: 'center' }}>
          <TextField size="small" value={v} placeholder={`Option ${i + 1}`} sx={{ flex: 1 }} onChange={e => updateAt(i, e.target.value)} />
          <IconButton size="small" color="error" onClick={() => removeAt(i)}><Icon name="Close" size={16} /></IconButton>
        </Box>)}
        <Button size="small" variant="outlined" onClick={() => onChange([...list, ''])} sx={{ alignSelf: 'flex-start' }}>+ Add Option</Button>
      </Box>;
    }

    // Recursive editor for one output schema field. Only depth 0 shows a
    // "default value" (the only depth that becomes a node widget) and is
    // removable via the caller's onRemove; nested ones remove themselves.
    function OutputFieldEditor(props) {
      const { field, onChange, onRemove, depth } = props;
      const isEnum = field.valueType === 'enum';
      const isArray = field.valueType === 'array';

      function updateChild(key, next) {
        onChange({ ...field, children: field.children.map(c => c.key === key ? next : c) });
      }
      function removeChild(key) {
        onChange({ ...field, children: field.children.filter(c => c.key !== key) });
      }
      function addChild() {
        onChange({ ...field, children: [...field.children, makeOutputField({})] });
      }

      return <Paper
        variant="outlined"
        sx={{ p: 1.5, ...(isArray ? { borderStyle: 'dashed', borderWidth: 2, bgcolor: arrayFieldShade(depth) } : null) }}>
        <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
          <Box sx={{ display: 'flex', gap: 1, alignItems: 'center', flexWrap: 'wrap' }}>
            <TextField
              size="small" variant="outlined" label="Field name" value={field.name} sx={{ minWidth: 160, flex: 1 }}
              onChange={e => onChange({ ...field, name: e.target.value })} />
            <FormControl size="small" sx={{ minWidth: 150 }}>
              <Select
                value={field.valueType}
                onChange={e => {
                  const nextType = e.target.value;
                  const needsChild = nextType === 'array' && field.children.length === 0;
                  onChange({ ...field, valueType: nextType, children: needsChild ? [makeOutputField({})] : field.children });
                }}>
                <MenuItem value="string">string</MenuItem>
                <MenuItem value="number">number</MenuItem>
                <MenuItem value="integer">integer</MenuItem>
                <MenuItem value="boolean">boolean</MenuItem>
                <MenuItem value="enum">string (enum)</MenuItem>
                <MenuItem value="array">array</MenuItem>
              </Select>
            </FormControl>
            <Box sx={{ flexGrow: 1 }} />
            <IconButton size="small" color="error" onClick={onRemove}><Icon name="Close" size={16} /></IconButton>
          </Box>
          <TextField
            size="small" variant="outlined" label="Description" value={field.description} fullWidth={true}
            multiline={true} minRows={2} maxRows={8}
            onChange={e => onChange({ ...field, description: e.target.value })} />
          {isEnum && <EnumValuesEditor values={field.enumValues} onChange={next => onChange({ ...field, enumValues: next })} />}
          {isArray && <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1, pl: 2, borderLeft: '2px solid', borderColor: 'divider' }}>
            {field.children.map(child => <OutputFieldEditor
              key={child.key} field={child} depth={depth + 1}
              onChange={next => updateChild(child.key, next)}
              onRemove={() => removeChild(child.key)} />)}
            <Button size="small" variant="outlined" onClick={addChild} sx={{ alignSelf: 'flex-start' }}>+ Add Nested Field</Button>
          </Box>}
        </Box>
      </Paper>;
    }

    function TemplateManagerDialog(props) {
      const { open, editTarget, onClose, onSave } = props;
      const [draft, setDraft] = useState(blankDraft);

      useEffect(() => {
        if (!open) return;
        if (editTarget) {
          const outputs = (editTarget.outputs || []).length ? editTarget.outputs.map(normalizeOutputField) : [makeOutputField({})];
          setDraft({ id: editTarget.id, name: editTarget.name, content: editTarget.content, outputs });
        } else {
          setDraft(blankDraft());
        }
      }, [open, editTarget]);

      const paramPreview = useMemo(() => extractPlaceholders(draft.content), [draft.content]);

      async function handleSave() {
        if (!draft.name.trim() || !draft.content.trim()) return;
        const saved = await onSave({ ...draft, outputs: draft.outputs.filter(o => o.name.trim()) });
        if (!saved) return;
        setDraft(blankDraft());
      }
      function addOutputField() {
        setDraft(d => ({ ...d, outputs: [...d.outputs, makeOutputField({})] }));
      }
      function updateOutputField(key, next) {
        setDraft(d => ({ ...d, outputs: d.outputs.map(f => f.key === key ? next : f) }));
      }
      function removeOutputField(key) {
        setDraft(d => ({ ...d, outputs: d.outputs.filter(f => f.key !== key) }));
      }

      return <Dialog open={open} onClose={onClose} fullWidth={true} maxWidth="xl">
        <DialogTitle>{draft.id ? 'Edit AI Node' : 'Create AI Node'}</DialogTitle>
        <DialogContent sx={{ display: 'flex', gap: 3, pt: '20px !important' }}>
          <Box sx={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 2 }}>
            <TextField
              variant="outlined" label="Node name" size="small" fullWidth={true} value={draft.name}
              onChange={e => setDraft(d => ({ ...d, name: e.target.value }))} />
            <TextField
              variant="outlined" label="Content (prompt)" size="small" fullWidth={true} multiline={true} minRows={14} maxRows={24}
              value={draft.content}
              onChange={e => setDraft(d => ({ ...d, content: e.target.value }))}
              helperText={'Parameter syntax: {string}  <number>  [option1,option2]  (use "#" for a default, e.g. <count#3>)'} />
            {paramPreview.length > 0 && <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.5 }}>
              {paramPreview.map(p => <Chip key={p.key} size="small" label={`${p.name} (${p.kind})`} />)}
            </Box>}
          </Box>
          <Divider orientation="vertical" flexItem={true} />
          <Box sx={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 1.5 }}>
            <Typography variant="subtitle2">Output Schema</Typography>
            <Typography variant="caption" color="text.secondary">
              {"Each top-level field becomes a named, read-only output port on the node, filled in from Codex's actual response once the node runs. Use \"array\" to nest fields describing each item's shape — this defines the JSON Schema the Structured Output call uses."}
            </Typography>
            <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1.5 }}>
              {draft.outputs.map(f => <OutputFieldEditor
                key={f.key} field={f} depth={0}
                onChange={next => updateOutputField(f.key, next)}
                onRemove={() => removeOutputField(f.key)} />)}
              <Button size="small" variant="outlined" onClick={addOutputField} sx={{ alignSelf: 'flex-start' }}>+ Add Output Field</Button>
            </Box>
          </Box>
        </DialogContent>
        <DialogActions>
          {draft.id && <Button size="small" onClick={() => setDraft(blankDraft())}>Switch to New Node</Button>}
          <Button onClick={onClose}>Close</Button>
          <Button variant="contained" onClick={handleSave} disabled={!draft.name.trim() || !draft.content.trim()}>
            {draft.id ? 'Save changes' : 'Save Node'}
          </Button>
        </DialogActions>
      </Dialog>;
    }

    // Replaces window.confirm() for anything destructive, to match the
    // rest of the MUI interface.
    function ConfirmDialog(props) {
      const { open, message, confirmLabel, confirmColor, onConfirm, onCancel } = props;
      return <Dialog open={open} onClose={onCancel} maxWidth="xs" fullWidth={true}>
        <DialogContent sx={{ pt: 3 }}><Typography variant="body2">{message}</Typography></DialogContent>
        <DialogActions>
          <Button onClick={onCancel}>Cancel</Button>
          <Button variant="contained" color={confirmColor || 'error'} onClick={onConfirm} autoFocus={true}>{confirmLabel || 'Delete'}</Button>
        </DialogActions>
      </Dialog>;
    }

    // validate_workflow results (common.py, via POST /evaluate), split into format (schema) and
    // wiring (graph) sections. Opens from the toolbar chip, or by itself
    // when Run is blocked by errors.
    function IssuesDialog(props) {
      const { open, issues, runBlocked, onClose, onFocusNode, onRemoveEdge } = props;
      const errorCount = issues.filter(i => i.level === 'error').length;
      const byLevel = list => [...list.filter(i => i.level === 'error'), ...list.filter(i => i.level !== 'error')];
      const section = (title, list) => list.length > 0 && <Box key={title} sx={{ mb: 2 }}>
        <Typography variant="overline" color="text.secondary">{`${title} (${list.length})`}</Typography>
        {byLevel(list).map((issue, i) => <Box
          key={i} data-testid="issue-row"
          sx={{ display: 'flex', gap: 1, alignItems: 'flex-start', py: 0.75, borderBottom: '1px solid', borderColor: 'divider' }}>
          <Box sx={{ color: issue.level === 'error' ? 'error.main' : 'warning.main', pt: '2px' }}>
            <Icon name={issue.level === 'error' ? 'Error' : 'Warning'} size={18} />
          </Box>
          <Typography variant="body2" sx={{ flex: 1, minWidth: 0, wordBreak: 'break-word' }}>{issue.message}</Typography>
          {issue.nodeId && <Button size="small" onClick={() => onFocusNode(issue.nodeId)}>Show</Button>}
          {issue.fix === 'removeEdge' && <Button size="small" color="error" onClick={() => onRemoveEdge(issue.edgeId)}>Remove Wire</Button>}
        </Box>)}
      </Box>;
      return <Dialog open={open} onClose={onClose} maxWidth="md" fullWidth={true}>
        <DialogTitle>Pre-Run Check</DialogTitle>
        <DialogContent dividers={true}>
          {runBlocked && errorCount > 0 && <Alert severity="error" sx={{ mb: 1.5 }}>{`Run blocked — fix ${errorCount} error(s) first.`}</Alert>}
          {issues.length === 0 && <Typography variant="body2" color="text.secondary">No problems found.</Typography>}
          {section('Format', issues.filter(i => i.kind === 'schema'))}
          {section('Wiring', issues.filter(i => i.kind === 'graph'))}
        </DialogContent>
        <DialogActions><Button onClick={onClose}>Close</Button></DialogActions>
      </Dialog>;
    }

    const RUN_LOG_COLORS = { info: 'text.primary', success: 'success.main', warning: 'warning.dark', error: 'error.main' };

    // Floating run-event log over the canvas (FlowApp's logEvent feeds it).
    function RunHistoryPanel(props) {
      const { log, onFocusNode, onClear, onClose } = props;
      const listRef = useRef(null);
      // Follow the newest entry.
      useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [log.length]);
      const pad = (v, n = 2) => String(v).padStart(n, '0');
      const time = at => { const d = new Date(at); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`; };
      return <Paper
        elevation={6} data-testid="run-history"
        sx={{ position: 'absolute', left: 16, bottom: 16, width: 560, maxWidth: 'calc(100% - 32px)', height: 300, zIndex: 5, display: 'flex', flexDirection: 'column' }}>
        <Box sx={{ display: 'flex', alignItems: 'center', px: 1.5, py: 0.5, borderBottom: '1px solid', borderColor: 'divider' }}>
          <Typography variant="subtitle2" sx={{ flex: 1 }}>{`Run History (${log.length})`}</Typography>
          <Button size="small" onClick={onClear} disabled={!log.length}>Clear</Button>
          <IconButton size="small" aria-label="Close run history" onClick={onClose}><Icon name="Close" size={16} /></IconButton>
        </Box>
        <Box ref={listRef} sx={{ flex: 1, overflowY: 'auto', px: 1.5, py: 0.5, fontFamily: 'monospace', fontSize: 12 }}>
          {log.length === 0 && <Typography variant="caption" color="text.secondary">Nothing yet — events appear here during a run.</Typography>}
          {log.map(entry => <Box key={entry.seq} data-testid="run-log-row" sx={{ display: 'flex', gap: 1, py: '1px', color: RUN_LOG_COLORS[entry.level] }}>
            <Box component="span" sx={{ color: 'text.secondary', flexShrink: 0 }}>{`#${entry.run} ${time(entry.at)}`}</Box>
            {entry.nodeId
              ? <Box
                  component="span" onClick={() => onFocusNode(entry.nodeId)}
                  sx={{ flexShrink: 0, maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', cursor: 'pointer', textDecoration: 'underline' }}>{`${entry.title} (${entry.nodeId})`}</Box>
              : <Box component="span" sx={{ flexShrink: 0, fontWeight: 'bold' }}>Workflow</Box>}
            <Box component="span" sx={{ wordBreak: 'break-word' }}>{entry.message}</Box>
          </Box>)}
        </Box>
      </Paper>;
    }

    function SaveWorkflowDialog(props) {
      const { open, defaultName, onClose, onSave } = props;
      const [name, setName] = useState('');

      useEffect(() => { if (open) setName(defaultName || ''); }, [open, defaultName]);

      return <Dialog open={open} onClose={onClose} fullWidth={true} maxWidth="xs">
        <DialogTitle>Save Workflow</DialogTitle>
        <DialogContent>
          <TextField
            autoFocus={true} variant="outlined" label="Workflow name" size="small" fullWidth={true} value={name}
            onChange={e => setName(e.target.value)} sx={{ mt: 1 }} />
        </DialogContent>
        <DialogActions>
          <Button onClick={onClose}>Cancel</Button>
          <Button variant="contained" disabled={!name.trim()} onClick={() => onSave(name.trim())}>Save</Button>
        </DialogActions>
      </Dialog>;
    }

    // Generate Workflow: a plain-words request -> Codex (POST /workflows/generate), polled
    // as a Codex job. State lives here, not in the Dialog, so closing it keeps the job.
    function GenerateWorkflowDialog(props) {
      const { open, onClose, onOpen } = props;
      const [request, setRequest] = useState('');
      const [jobId, setJobId] = useState(null);
      const [job, setJob] = useState(null);
      const [error, setError] = useState(null);
      const finished = job && ['done', 'error', 'stopped'].includes(job.status);
      const busy = !!jobId && !finished && !error;

      useEffect(() => {
        if (!jobId) return;
        let cancelled = false, timer = null, failures = 0;
        async function poll() {
          try {
            const j = await fetchCodexJobRequest(jobId);
            if (cancelled) return;
            failures = 0;
            setJob(j);
            if (['done', 'error', 'stopped'].includes(j.status)) return;
          } catch (e) {
            if (cancelled) return;
            if (++failures >= RUN_POLL_MAX_FAILURES) { setError(`Lost the generation job — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`); return; }
          }
          timer = setTimeout(poll, RUN_POLL_INTERVAL_MS);
        }
        poll();
        return () => { cancelled = true; clearTimeout(timer); };
      }, [jobId]);

      async function generate() {
        setJob(null); setError(null); setJobId(null);
        try {
          const res = await generateWorkflowRequest(request.trim());
          setJobId(res.job_id);
        } catch (e) {
          setError(`Failed to start — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
        }
      }

      const output = job && job.output;
      const issues = (output && output.issues) || [];
      return <Dialog open={open} onClose={onClose} fullWidth={true} maxWidth="md">
        <DialogTitle>Generate Workflow</DialogTitle>
        <DialogContent dividers={true} sx={{ display: 'flex', flexDirection: 'column', gap: 1.5 }}>
          <TextField
            data-testid="generate-request" autoFocus={true} variant="outlined" label="What should the workflow do?"
            multiline={true} minRows={4} fullWidth={true} value={request} disabled={busy} sx={{ mt: 1 }}
            onChange={e => setRequest(e.target.value)} />
          <Typography variant="caption" color="text.secondary">
            Codex builds it from the Plugin Nodes, Group, Wrapper and saved AI Nodes. Nothing is saved or run — it opens on the canvas for you to check.
          </Typography>
          {busy && <Box>
            <LinearProgress />
            <Typography variant="caption" color="text.secondary">
              {`Generating… ${job ? Math.round(job.elapsed_seconds) : 0}s`}
            </Typography>
          </Box>}
          {error && <Alert severity="error">{error}</Alert>}
          {job && job.status === 'error' && <Alert severity="error">{job.error || 'Generation failed.'}</Alert>}
          {job && job.status === 'stopped' && <Alert severity="info">Stopped.</Alert>}
          {output && <Box data-testid="generate-result" sx={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
            <Typography variant="subtitle2">
              {`${output.workflow.name} — ${Object.keys(output.workflow.nodes).length} node(s), ${output.workflow.edges.length} wire(s)` +
              (output.attempts > 1 ? ` (${output.attempts} tries)` : '')}
            </Typography>
            {output.summary && <Typography variant="body2" sx={{ whiteSpace: 'pre-wrap' }}>{output.summary}</Typography>}
            {issues.length === 0
              ? <Alert severity="success">No problems found.</Alert>
              : <Alert severity={issues.some(i => i.level === 'error') ? 'error' : 'warning'}>
                  {issues.map((i, k) => <Typography key={k} variant="body2">{i.message}</Typography>)}
              </Alert>}
          </Box>}
        </DialogContent>
        <DialogActions>
          <Button onClick={onClose}>Close</Button>
          {busy
            ? <Button color="error" onClick={() => stopCodexJobRequest(jobId).catch(() => {})}>Stop</Button>
            : <Button disabled={!request.trim()} onClick={generate}>{output ? 'Generate Again' : 'Generate'}</Button>}
          {output && !busy && <Button variant="contained" data-testid="generate-open" onClick={() => onOpen(output.workflow)}>Open on Canvas</Button>}
        </DialogActions>
      </Dialog>;
    }

    // Wrapper's Max retries: a number field whose step below 0 is ∞ (UNLIMITED_RETRIES);
    // ↑/↓ keys and the ▲/▼ buttons step, "∞" or a negative number typed means ∞.
    function RetriesField({ value, disabled, onChange }) {
      const unlimited = value === UNLIMITED_RETRIES;
      const step = d => onChange(Math.max(UNLIMITED_RETRIES, (unlimited ? -1 : value) + d));
      // Digits typed next to "∞" replace it; "-…" or a lone "∞" means ∞; empty means 0.
      const parse = text => {
        if (/^\s*-/.test(text)) return UNLIMITED_RETRIES;
        const digits = text.replace(/[^0-9]/g, '');
        return digits ? parseInt(digits, 10) : (text.includes('∞') ? UNLIMITED_RETRIES : 0);
      };
      const arrow = (label, d) => <IconButton
        size="small" disabled={disabled} tabIndex={-1} sx={{ p: 0, fontSize: 10, lineHeight: 1 }} onClick={() => step(d)}>{label}</IconButton>;
      return <TextField
        label="Max retries" size="small" fullWidth={true} variant="outlined" disabled={disabled}
        value={unlimited ? '∞' : String(value)}
        inputProps={{ inputMode: 'numeric', 'data-testid': 'max-retries' }}
        onChange={e => onChange(parse(e.target.value))}
        onKeyDown={e => {
          if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); step(e.key === 'ArrowUp' ? 1 : -1); }
        }}
        InputProps={{
          endAdornment: <InputAdornment position="end">
            <Box sx={{ display: 'flex', flexDirection: 'column' }}>{arrow('▲', 1)}{arrow('▼', -1)}</Box>
          </InputAdornment>,
        }}
        helperText={unlimited ? 'Retries until the conditions pass (or Stop)' : undefined} />;
    }

    // Add-node menu: one button per node type.
    function NodeTypeButtons({ types, color, onAdd }) {
      return <Box sx={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 1 }}>
        {types.map(t => <Button
          key={t.type} size="small" variant="outlined" fullWidth={true}
          sx={{ color, borderColor: color }} onClick={() => onAdd(t.type)}>{t.title}</Button>)}
      </Box>;
    }

    function FlowApp() {
      const [nodes, setNodes] = useState({});
      const [edges, setEdges] = useState([]);
      const [selection, setSelection] = useState(null);
      // Nodes picked by the right-drag box (moved together by dragging any of them).
      const [boxSelected, setBoxSelected] = useState(() => new Set());
      // The right-drag box being drawn, in paneWrap pixels ({x0, y0, x1, y1}).
      const [selectBox, setSelectBox] = useState(null);
      // Right-side panel for the selected node. editPanelClosed (X button) resets when
      // the selection moves to another node — done during render, the React pattern
      // for state derived from a changing input, so no stale frame commits.
      const [editPanelClosed, setEditPanelClosed] = useState(false);
      const selectedNodeId = (selection && selection.type === 'node') ? selection.id : null;
      const prevSelectedNodeIdForPanelRef = useRef(selectedNodeId);
      if (prevSelectedNodeIdForPanelRef.current !== selectedNodeId) {
        prevSelectedNodeIdForPanelRef.current = selectedNodeId;
        if (editPanelClosed) setEditPanelClosed(false);
      }
      const editingNode = (selectedNodeId && !editPanelClosed) ? nodes[selectedNodeId] : null;
      const [templates, setTemplates] = useState([]);
      const [templatesError, setTemplatesError] = useState(null);
      const [templateManagerOpen, setTemplateManagerOpen] = useState(false);
      const [editTarget, setEditTarget] = useState(null);
      const [isRunningWorkflow, setIsRunningWorkflow] = useState(false);
      const [currentWorkflowId, setCurrentWorkflowId] = useState(null);
      const [currentWorkflowName, setCurrentWorkflowName] = useState('');
      const [saveWorkflowOpen, setSaveWorkflowOpen] = useState(false);
      const [generateOpen, setGenerateOpen] = useState(false);
      const [workflows, setWorkflows] = useState([]);
      const [workflowsError, setWorkflowsError] = useState(null);
      const [confirmState, setConfirmState] = useState(null);
      // Pre-run check dialog: null (closed) or { runBlocked }.
      const [issuesDialog, setIssuesDialog] = useState(null);
      const [runLog, setRunLog] = useState([]);
      const [historyOpen, setHistoryOpen] = useState(false);
      // Node/workflow menu: hidden behind the canvas "+" button until opened.
      const [menuOpen, setMenuOpen] = useState(false);
      // Hourglass waiting reasons only once a run has started — an idle,
      // never-run graph stays neutral (same rule as the card border's run state).
      const [showWaiting, setShowWaiting] = useState(false);
      // GET /node-types: the type list (menu order) and files that failed to load.
      const [nodeTypeList, setNodeTypeList] = useState([]);
      const [nodeTypeErrors, setNodeTypeErrors] = useState([]);
      const typesByType = useMemo(() => Object.fromEntries(nodeTypeList.map(t => [t.type, t])), [nodeTypeList]);
      // 'connecting' until the first answer, 'down' while api_server.py is unreachable
      // (the canvas is covered and can't be edited), else 'ok'.
      const [serverState, setServerState] = useState('connecting');
      // POST /evaluate's latest answer (common.py editor_view).
      const [view, setView] = useState({ nodes: {}, issues: [], connected: [] });
      // A server run is alive (also while only its Delays are left) — the Stop button.
      const [runLive, setRunLive] = useState(false);
      function askConfirm(message, action, opts) {
        setConfirmState({ message, action, confirmLabel: opts && opts.confirmLabel, confirmColor: opts && opts.confirmColor });
      }

      // Bottom-center error toast for failures with no natural inline spot
      // (e.g. opening a thread-id folder that doesn't exist yet).
      const [toast, setToast] = useState(null);
      const notify = msg => setToast(msg);

      // AI Nodes are stored server-side as JSON files (api_server.py /nodes).
      function loadTemplates() {
        fetchNodeList()
          .then(data => { setTemplates(data.nodes || []); setTemplatesError(null); })
          .catch(e => setTemplatesError(`Could not load AI nodes — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`));
      }
      // Node types first; retried until api_server.py answers. The menu's lists load
      // each time the server comes (back) up.
      useEffect(() => {
        let timer = null;
        let cancelled = false;
        function load() {
          fetchNodeTypes()
            .then(body => {
              if (cancelled) return;
              setNodeTypeList(body.types || []);
              setNodeTypeErrors(body.errors || []);
              setServerState('ok');
            })
            .catch(() => {
              if (cancelled) return;
              setServerState('down');
              timer = setTimeout(load, SERVER_RETRY_MS);
            });
        }
        load();
        return () => { cancelled = true; clearTimeout(timer); };
      }, []);
      useEffect(() => {
        if (serverState !== 'ok') return;
        loadTemplates();
        loadWorkflowList();
      }, [serverState]);
      // Keeps each AI Node's definition fields (name/content/outputs) in step
      // with its palette template (data.templateId); run state is untouched. A node
      // without templateId matches by title only when exactly one template has that
      // name. A function, not just an effect: loadWorkflow calls it too, since
      // loading replaces `nodes` without `templates` changing.
      function syncTemplateNodesWithCatalog(templatesList) {
        if (!templatesList.length) return;
        const byId = {};
        const nameCounts = {};
        templatesList.forEach(t => { byId[t.id] = t; nameCounts[t.name] = (nameCounts[t.name] || 0) + 1; });
        const byUniqueName = {};
        templatesList.forEach(t => { if (nameCounts[t.name] === 1) byUniqueName[t.name] = t; });

        setNodes(prev => {
          let changed = false;
          const next = { ...prev };
          Object.values(prev).forEach(node => {
            if (node.type !== 'template') return;
            const template = (node.data.templateId && byId[node.data.templateId])
              || (!node.data.templateId ? byUniqueName[node.data.title] : null);
            if (!template) return;
            const outputs = (template.outputs || []).map(normalizeOutputField);
            const inSync = node.data.templateId === template.id && node.data.title === template.name
              && node.data.content === template.content
              && JSON.stringify(outputs) === JSON.stringify(node.data.outputs);
            if (inSync) return;
            changed = true;
            next[node.id] = {
              ...node,
              data: { ...node.data, templateId: template.id, title: template.name, content: template.content, outputs },
            };
          });
          return changed ? next : prev;
        });
      }
      useEffect(() => { syncTemplateNodesWithCatalog(templates); }, [templates]);

      // Dragging/panning/zooming/connection-dragging are all handled by
      // React Flow — screenToFlowPosition() converts a screen point to
      // flow coordinates (resize dragging, placing a new node at center).
      const rfInstance = useReactFlow();
      const updateNodeInternals = useUpdateNodeInternals();
      const paneWrapRef = useRef(null);
      // Right-drag on the empty canvas draws a box; the nodes it touches get selected.
      function beginBoxSelect(e) {
        if (e.button !== 2 || !e.target.classList.contains('react-flow__pane')) return;
        e.preventDefault();
        const wrap = paneWrapRef.current.getBoundingClientRect();
        const x0 = e.clientX - wrap.left, y0 = e.clientY - wrap.top;
        const start = { x: e.clientX, y: e.clientY };
        setSelectBox({ x0, y0, x1: x0, y1: y0 });
        const onMove = ev => setSelectBox({ x0, y0, x1: ev.clientX - wrap.left, y1: ev.clientY - wrap.top });
        const onUp = ev => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          setSelectBox(null);
          // The right-button release fires contextmenu where it lands — swallow it so it
          // can't reach a port (whose right-click deletes its wires).
          const swallow = ce => { ce.preventDefault(); ce.stopPropagation(); };
          window.addEventListener('contextmenu', swallow, { capture: true, once: true });
          setTimeout(() => window.removeEventListener('contextmenu', swallow, { capture: true }), 300);
          const a = rfInstance.screenToFlowPosition(start);
          const b = rfInstance.screenToFlowPosition({ x: ev.clientX, y: ev.clientY });
          const rect = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), width: Math.abs(a.x - b.x), height: Math.abs(a.y - b.y) };
          const ids = rect.width && rect.height ? rfInstance.getIntersectingNodes(rect, true).map(n => n.id) : [];
          setBoxSelected(new Set(ids));
          setSelection(ids.length === 1 ? { type: 'node', id: ids[0] } : null);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      }
      const nodeIdRef = useRef(1);
      const edgeIdRef = useRef(1);
      const zCounterRef = useRef(1);
      // Only the hand-rolled resize-handle drag still needs a persistent
      // window listener pair (React Flow's own NodeResizer would steal
      // the west/east ports' hit area — see PortHandle/makeResizeHandles).
      const interactionRef = useRef({ mode: null });
      // Kept fresh so async callers (the run client starting a run, log
      // entries resolving a node's title) always read each node's latest
      // data instead of the stale snapshot from render start.
      const nodesRef = useRef(nodes);
      const edgesRef = useRef(edges);
      // Latest server view / type list, for callbacks (log titles) that outlive a render.
      const viewRef = useRef(view);
      viewRef.current = view;
      const typesByTypeRef = useRef(typesByType);
      typesByTypeRef.current = typesByType;
      // React Flow drags fire 'position' on every pointermove, uncapped —
      // coalesce to one setNodes commit per frame, like flush() below.
      const pendingPositionsRef = useRef(new Map());
      const positionRafRef = useRef(null);

      const logSeqRef = useRef(0);   // unique React key per log entry
      // nodeId null = workflow-level event. level: info|success|warning|error.
      const logEvent = useCallback((nodeId, message, level = 'info') => {
        // Title captured now — the node may be gone/renamed by the time the log is read.
        const node = nodeId && nodesRef.current[nodeId];
        const nodeView = nodeId && viewRef.current.nodes[nodeId];
        const title = nodeView ? nodeView.title : node ? ((typesByTypeRef.current[node.type] || {}).title || node.type) : nodeId;
        const run = runnerRef.current ? runnerRef.current.activeRun.id : 0;
        const entry = { seq: ++logSeqRef.current, at: Date.now(), run, nodeId, title, message, level };
        setRunLog(prev => (prev.length >= RUN_LOG_MAX ? prev.slice(prev.length - RUN_LOG_MAX + 1) : prev).concat(entry));
      }, []);

      useEffect(() => { nodesRef.current = nodes; }, [nodes]);
      useEffect(() => { edgesRef.current = edges; }, [edges]);

      // Belt-and-suspenders: force React Flow to re-measure every node's
      // handle positions (not just the one dragged/resized) once an
      // interaction ends. On a large graph, the rapid re-render stream a
      // drag produces has been observed to strand some OTHER untouched
      // node's handleBounds; this is cheap since it only runs once per
      // interaction, not per frame.
      const resyncAllNodeInternals = useCallback(() => {
        updateNodeInternals(Object.keys(nodesRef.current));
      }, [updateNodeInternals]);

      useEffect(() => {
        // Coalesce a raw mousemove stream (can exceed 60/s) to one commit
        // per animation frame — calling setNodes on every event outran
        // React Flow's node lookup and dropped nodes from the canvas
        // mid-drag (underlying state stayed intact; reopening recovered it).
        let rafId = null;
        let pending = null;
        function flush() {
          rafId = null;
          if (!pending) return;
          const { id, width, bodyHeight, x, y } = pending;
          pending = null;
          setNodes(prev => prev[id] ? { ...prev, [id]: { ...prev[id], width, bodyHeight, x, y } } : prev);
          // React Flow's own ResizeObserver can drop a notification under
          // this drag's rapid-fire churn — force a synchronous re-measure
          // instead of hoping it catches up, since we already know the new size.
          updateNodeInternals(id);
        }
        function onMove(e) {
          const it = interactionRef.current;
          if (it.mode !== 'resizeNode') return;
          // Mouse released outside a place this window sees mouseup (past
          // the taskbar, focus lost) would otherwise strand the
          // interaction in resizeNode mode forever — bail once the
          // primary button reads as no longer held.
          if (!(e.buttons & 1)) { onUp(); return; }
          const w = rfInstance.screenToFlowPosition({ x: e.clientX, y: e.clientY });
          const dx = w.x - it.startWorldX, dy = w.y - it.startWorldY;
          const dir = it.dir;
          let width = it.startWidth, x = it.startX;
          let bodyHeight = it.startBodyHeight, y = it.startY;
          if (dir.includes('e')) {
            width = Math.max(MIN_NODE_WIDTH, snapToGrid(it.startWidth + dx));
          } else if (dir.includes('w')) {
            width = Math.max(MIN_NODE_WIDTH, snapToGrid(it.startWidth - dx));
            x = it.startX + (it.startWidth - width);
          }
          // Snap the delta, not the body: the start height is already
          // grid-aligned as a whole card (gridAlignedBodyHeight), so whole
          // grid steps keep it aligned. minDelta = largest shrink above MIN_BODY_HEIGHT.
          const minDelta = -Math.floor((it.startBodyHeight - MIN_BODY_HEIGHT) / GRID_SIZE) * GRID_SIZE;
          if (dir.includes('s')) {
            bodyHeight = it.startBodyHeight + Math.max(minDelta, snapToGrid(dy));
          } else if (dir.includes('n')) {
            const d = Math.max(minDelta, snapToGrid(-dy));
            bodyHeight = it.startBodyHeight + d;
            y = it.startY - d;
          }
          pending = { id: it.id, width, bodyHeight, x, y };
          if (rafId === null) rafId = requestAnimationFrame(flush);
        }
        function onUp() {
          interactionRef.current = { mode: null };
          if (rafId !== null) { cancelAnimationFrame(rafId); }
          flush();
          resyncAllNodeInternals();
        }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        // Covers focus leaving the window mid-drag with no further mouse event at all.
        window.addEventListener('blur', onUp);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('blur', onUp);
          if (rafId !== null) cancelAnimationFrame(rafId);
        };
      }, [rfInstance, updateNodeInternals, resyncAllNodeInternals]);

      // Delete key — React Flow's own deleteKeyCode is off (see <ReactFlow>
      // props) so this is the one place deletion happens, guarding against
      // eating a Backspace meant for a focused text field.
      useEffect(() => {
        function onKey(e) {
          if (serverState !== 'ok') return;
          if ((e.key === 'Delete' || e.key === 'Backspace') && selection) {
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
            if (selection.type === 'node') deleteNode(selection.id);
            else deleteEdge(selection.id);
            setSelection(null);
          }
        }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [selection, nodes, edges, serverState]);

      function centerFlowPoint() {
        const rect = paneWrapRef.current.getBoundingClientRect();
        const jitter = () => Math.random() * 60 - 30;
        return rfInstance.screenToFlowPosition({ x: rect.left + rect.width / 2 + jitter(), y: rect.top + rect.height / 2 + jitter() });
      }

      function addNode(type) {
        const info = typesByType[type];
        const id = 'n' + (nodeIdRef.current++);
        const c = centerFlowPoint();
        setNodes(prev => ({ ...prev, [id]: { id, type, x: snapToGrid(c.x - NODE_WIDTH / 2), y: snapToGrid(c.y - 40), z: ++zCounterRef.current, bodyHeight: info.defaultBodyHeight, data: JSON.parse(JSON.stringify(info.defaultData || {})) } }));
        setSelection({ type: 'node', id });
      }

      function addTemplateNode(template) {
        const id = 'n' + (nodeIdRef.current++);
        const paramDefs = extractPlaceholders(template.content);
        const values = {};
        paramDefs.forEach(p => { values[p.key] = p.defaultValue; });
        const outputs = (template.outputs || []).map(normalizeOutputField);
        const outputValues = {};
        outputs.forEach(o => { outputValues[o.key] = ''; });
        const c = centerFlowPoint();
        setNodes(prev => ({
          ...prev,
          [id]: {
            id, type: 'template', x: snapToGrid(c.x - NODE_WIDTH / 2), y: snapToGrid(c.y - 40), z: ++zCounterRef.current,
            bodyHeight: TEMPLATE_DEFAULT_BODY_HEIGHT,
            data: { templateId: template.id, title: template.name, content: template.content, values, outputs, outputValues },
          },
        }));
        setSelection({ type: 'node', id });
        setTemplateManagerOpen(false);
      }

      async function saveTemplate(draft) {
        const body = { name: draft.name, content: draft.content, outputs: draft.outputs };
        try {
          const saved = await saveNodeRequest(draft.id, body);
          setTemplates(prev => {
            const exists = prev.some(t => t.id === saved.id);
            return exists ? prev.map(t => t.id === saved.id ? saved : t) : [...prev, saved];
          });
          setTemplatesError(null);
          return saved;
        } catch (e) {
          setTemplatesError(`Failed to save node — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
          return null;
        }
      }

      function deleteTemplate(id) {
        askConfirm('Delete this node? (Nodes already placed from it are not affected.)', async () => {
          try {
            await deleteNodeRequest(id);
            setTemplates(prev => prev.filter(t => t.id !== id));
            setTemplatesError(null);
          } catch (e) {
            setTemplatesError(`Failed to delete node — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
          }
        });
      }

      // After loading a workflow, new nodes/edges must not collide with
      // its ids — bump the counters past whatever it has.
      function bumpIdCountersPastLoaded(loadedNodes, loadedEdges) {
        let maxNode = 0, maxEdge = 0, maxZ = 0;
        Object.keys(loadedNodes || {}).forEach(id => {
          const m = /^n(\d+)$/.exec(id);
          if (m) maxNode = Math.max(maxNode, parseInt(m[1], 10));
          maxZ = Math.max(maxZ, (loadedNodes[id] && loadedNodes[id].z) || 0);
        });
        (loadedEdges || []).forEach(e => {
          const m = /^e(\d+)$/.exec(e.id);
          if (m) maxEdge = Math.max(maxEdge, parseInt(m[1], 10));
        });
        nodeIdRef.current = Math.max(nodeIdRef.current, maxNode + 1);
        edgeIdRef.current = Math.max(edgeIdRef.current, maxEdge + 1);
        zCounterRef.current = Math.max(zCounterRef.current, maxZ + 1);
      }

      async function saveWorkflow(name) {
        const { x, y, zoom } = rfInstance.getViewport();
        const body = { name, nodes, edges, pan: { x, y }, zoom };
        try {
          const saved = await saveWorkflowRequest(currentWorkflowId, body);
          setCurrentWorkflowId(saved.id);
          setCurrentWorkflowName(saved.name);
          setSaveWorkflowOpen(false);
          const entry = { id: saved.id, name: saved.name, node_count: Object.keys(saved.nodes || {}).length };
          setWorkflows(prev => {
            const exists = prev.some(w => w.id === entry.id);
            return exists ? prev.map(w => w.id === entry.id ? entry : w) : [entry, ...prev];
          });
          setWorkflowsError(null);
        } catch (e) {
          notify(`Failed to save workflow — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`);
        }
      }

      function loadWorkflowList() {
        fetchWorkflowList()
          .then(data => { setWorkflows(data.workflows || []); setWorkflowsError(null); })
          .catch(e => setWorkflowsError(`Could not load workflows — is api_server.py running on ${CODEX_API_BASE}? (${e.message || e})`));
      }

      // Replaces the canvas with wf. id null = not saved yet (Save creates a new one).
