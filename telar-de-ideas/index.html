<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Telar de Ideas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    /* "Still in progress" card border (AppNode, driven by
       compute_run_states in common.py) — blinks red while a Created Node
       is actively executing, a Gate is still waiting on its compare wires,
       or a Group contains such a node. */
    @keyframes nodeRunningBlink {
      0%, 100% { border-color: #d32f2f; outline-color: #d32f2f; }
      50% { border-color: #ffcdd2; outline-color: #ffcdd2; }
    }
  </style>
  <link rel="stylesheet" href="lib/reactflow.css">
  <script src="lib/react.min.js"></script>
  <script src="lib/react-dom.min.js"></script>
  <script>
    // @xyflow/react's UMD build expects the automatic JSX runtime as a
    // global (no standalone UMD build of react/jsx-runtime exists) — this
    // is a faithful manual jsx/jsxs shim via React.createElement.
    (function () {
      function jsx(type, props, key) {
        const p = props || {};
        if (key !== undefined) p.key = key;
        return React.createElement(type, p);
      }
      window.jsxRuntime = { jsx, jsxs: jsx, Fragment: React.Fragment };
    })();
  </script>
  <script src="lib/reactflow.umd.js"></script>
  <script src="lib/material-ui.min.js"></script>
  <script src="lib/icons-data.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const {
      Box, AppBar, Toolbar, Typography, Button, IconButton, TextField,
      Select, MenuItem, FormControl, Paper, Divider, Fab, InputAdornment,
      Dialog, DialogTitle, DialogContent, DialogActions, Chip, CircularProgress, LinearProgress,
      Tooltip, Alert, Snackbar, ToggleButton, ToggleButtonGroup, SvgIcon, Link,
      ThemeProvider, createTheme, colors,
    } = MaterialUI;
    // Labels render as written (MUI uppercases by default). Title Case for buttons,
    // toggles, titles and node names; sentence case for labels, captions, tooltips, chips.
    const THEME = createTheme({
      typography: { button: { textTransform: 'none' }, overline: { textTransform: 'none' } },
    });
    // For colors outside sx (React Flow styles, template strings).
    const PALETTE = THEME.palette;
    const {
      ReactFlow, ReactFlowProvider, Background, BackgroundVariant,
      Handle, Position, BaseEdge, EdgeLabelRenderer, getBezierPath,
      useReactFlow, useUpdateNodeInternals,
    } = window.ReactFlow;
    const { useState, useRef, useEffect, useMemo, useCallback } = React;
    const h = React.createElement;

    // Real Material Design icon paths (same set @mui/icons-material ships),
    // kept as a tiny local data file instead of pulling in the whole
    // icons-material package — see Codex/gui's lib/icons-data.js. Each entry is one <path>.
    const ICON_PATHS = Object.fromEntries(window.MUI_ICONS.map(([name, svg]) => [name, svg.match(/ d="([^"]+)"/)[1]]));
    function Icon({ name, size = 20, style }) {
      return h(SvgIcon, { sx: { fontSize: size, display: 'block' }, style }, h('path', { d: ICON_PATHS[name] }));
    }

    // A row's connection dot over React Flow's <Handle> (which owns connecting);
    // `top` = the row's vertical center.
    function PortHandle(props) {
      const { nodeId, port, isOutput, top, colorOverride, onContextMenu } = props;
      const color = colorOverride || PORT_UNCONNECTED_COLOR;
      return h(Handle, {
        type: isOutput ? 'source' : 'target',
        position: isOutput ? Position.Right : Position.Left,
        id: port.id,
        onContextMenu: e => { e.preventDefault(); e.stopPropagation(); onContextMenu && onContextMenu(nodeId, port.id); },
        style: {
          top, width: DOT_SIZE, height: DOT_SIZE, borderRadius: '50%',
          background: color, border: `2px solid ${PALETTE.common.white}`, boxShadow: '0 0 0 1px rgba(0,0,0,0.25)',
          pointerEvents: 'all', cursor: isOutput ? 'crosshair' : 'default',
        },
      });
    }

    // Small square colored Button for header actions (stop/retry/delete/view).
    function HeaderActionButton(props) {
      const { color, variant, disabled, onClick, title, children } = props;
      const btn = h(Button, {
        size: 'small', color, variant: variant || 'contained', disabled,
        className: 'nodrag',
        onMouseDown: e => e.stopPropagation(),
        onClick: e => { e.stopPropagation(); onClick(); },
        sx: {
          minWidth: 24, width: 24, height: 22, p: 0, fontSize: 12, lineHeight: 1, boxShadow: 'none', '&:hover': { boxShadow: 'none' },
          // A disabled contained button's default dark fill nearly
          // vanishes against these colored headers — fade to a light
          // translucent chip instead.
          '&.Mui-disabled': { bgcolor: 'rgba(255,255,255,0.25)', color: 'rgba(255,255,255,0.65)' },
        },
      }, children);
      // Tooltip needs a ref-forwarding child; a disabled Button won't fire
      // hover events, so wrap it in a span when disabled.
      return h(Tooltip, { title }, disabled ? h('span', null, btn) : btn);
    }

    // Shows exactly what was sent to Codex (prompt + output schema) and
    // what came back, for whichever template node is open.
    function NodeDetailDialog(props) {
      const { open, node, onClose } = props;
      const req = node && node.data.lastRequest;
      const res = node && node.data.lastResponse;
      const prev = node && node.data.previousRun;
      const isRunning = node && (node.data.runStatus === 'running' || node.data.runStatus === 'starting');
      return h(Dialog, { open, onClose, maxWidth: 'sm', fullWidth: true },
        h(DialogTitle, null, 'Node Details'),
        h(DialogContent, { dividers: true },
          h(Typography, { variant: 'overline', color: 'text.secondary', sx: { display: 'block' } }, 'Request'),
          req
            ? h(Box, { sx: { mb: 2 } },
                h(Typography, { variant: 'body2', sx: { whiteSpace: 'pre-wrap', wordBreak: 'break-word', mb: req.outputSchema ? 1 : 0 } }, req.prompt),
                req.outputSchema && h(Box, { sx: { bgcolor: 'grey.100', borderRadius: 1, p: 1 } },
                  h(Typography, { variant: 'caption', color: 'text.secondary', sx: { display: 'block', mb: 0.5 } }, 'Output Schema'),
                  h(Typography, {
                    variant: 'body2', component: 'pre',
                    sx: { whiteSpace: 'pre-wrap', wordBreak: 'break-word', m: 0, fontFamily: 'monospace', fontSize: 12 },
                  }, JSON.stringify(req.outputSchema, null, 2))
                )
              )
            : h(Typography, { variant: 'body2', color: 'text.secondary', sx: { mb: 2 } }, '(not run yet)'),
          h(Typography, { variant: 'overline', color: 'text.secondary', sx: { display: 'block' } }, 'Response'),
          isRunning
            ? h(LinearProgress, { sx: { mt: 1 } })
            : h(Typography, {
                variant: 'body2', component: 'pre',
                sx: { whiteSpace: 'pre-wrap', wordBreak: 'break-word', m: 0, fontFamily: 'monospace', fontSize: 12 },
              }, (res && res.raw) || '(no response)'),
          // The attempt before the latest one (e.g. the run a Wrapper retry replaced).
          prev && h(Box, { sx: { mt: 2, pt: 1, borderTop: '1px solid', borderColor: 'divider' } },
            h(Typography, { variant: 'overline', color: 'text.secondary', sx: { display: 'block' } }, 'Previous Response'),
            h(Typography, { variant: 'caption', color: prev.runStatus === 'done' ? 'text.secondary' : 'error', sx: { display: 'block', mb: 0.5 } },
              [prev.runStatus || 'unknown', prev.response && prev.response.threadId, prev.runError].filter(Boolean).join(' · ')),
            h(Typography, {
              variant: 'body2', component: 'pre',
              sx: { whiteSpace: 'pre-wrap', wordBreak: 'break-word', m: 0, fontFamily: 'monospace', fontSize: 12 },
            }, (prev.response && prev.response.raw) || '(no response)')
          )
        ),
        h(DialogActions, null, h(Button, { onClick: onClose }, 'Close'))
      );
    }

    // Shared "one-line error message" look — every node type's transient
    // failure text renders identically instead of each inventing its own
    // Typography/color/truncation combo.
    function ErrorText({ children }) {
      return h(Typography, { variant: 'caption', color: 'error', sx: { wordBreak: 'break-all' } }, children);
    }

    // Shared vertical layout for multi-control bodies.
    function BodyStack({ children }) {
      return h(Box, { sx: { display: 'flex', flexDirection: 'column', gap: 1 } }, children);
    }

    // ---- Card body widgets ----
    // A node's body is a list of widgets its type's body(node, view) returns
    // (POST /evaluate; see common.py "Node types"). Unknown kinds render nothing.
    const CAPTION_COLORS = { error: 'error', success: 'success.main' };
    const DARK_BOX_SX = { bgcolor: 'grey.900', color: 'common.white', borderRadius: 1, p: 1, wordBreak: 'break-all', fontFamily: 'monospace', fontSize: 13 };

    function chipOf(w, key) {
      return h(Chip, {
        key, size: 'small', color: w.color || 'default', variant: w.variant || 'filled', label: w.label,
        sx: { alignSelf: 'flex-start' },
        icon: w.icon ? h(Icon, { name: w.icon, size: 16, style: { color: 'inherit' } }) : undefined,
      });
    }

    const BODY_WIDGETS = {
      caption: w => h(Typography, { variant: 'caption', color: CAPTION_COLORS[w.color] || 'text.secondary' }, w.text),
      chip: w => chipOf(w),
      chips: w => h(Box, { sx: { display: 'flex', flexWrap: 'wrap', gap: 0.5 } },
        (w.items || []).length
          ? w.items.map((c, i) => chipOf(c, i))
          : w.empty && h(Typography, { variant: 'caption', color: 'text.secondary' }, w.empty)),
      value: w => h(Box, { sx: { ...DARK_BOX_SX, minHeight: 40 } }, w.text),
      pairs: w => h(Box, { sx: { ...DARK_BOX_SX, display: 'flex', flexDirection: 'column', gap: 0.5 } },
        (w.rows || []).map((r, i) => h(Box, { key: i },
          h(Box, { component: 'span', sx: { color: colors.blue[200] } }, `${r.name}: `), r.value))),
      path: w => h(Box, { sx: { bgcolor: 'grey.100', borderRadius: 1, p: 1, wordBreak: 'break-all' } },
        w.text === undefined
          ? h(Typography, { variant: 'caption', color: 'text.secondary' }, w.empty)
          : h(Typography, { variant: 'caption', sx: { fontFamily: 'monospace', wordBreak: 'break-all' } }, w.text)),
      open: (w, { id, data }) => h(Button, {
        size: 'small', variant: 'outlined', className: 'nodrag',
        onClick: () => data.onOpenPath(id, w.path),
      }, w.label),
      error: w => h(ErrorText, null, w.text),
      alert: w => h(Alert, { severity: w.severity || 'error', variant: 'outlined', sx: { py: 0 } }, w.text),
    };

    function WidgetBody({ widgets, id, data }) {
      if (!widgets || !widgets.length) return null;
      return h(BodyStack, null, widgets.map((w, i) => {
        const render = BODY_WIDGETS[w.kind];
        return render ? h(React.Fragment, { key: i }, render(w, { id, data })) : null;
      }));
    }

    // ---- Edit-panel fields ----
    // The right-side panel's form for the selected node: its type's FIELDS /
    // fields(node) widgets (POST /evaluate). Values always come from the local
    // node data (so typing never waits on the server); edits apply immediately.
    function FieldControl({ field, value, onChange, disabled, autoFocus }) {
      const common = { size: 'small', fullWidth: true, variant: 'outlined', disabled, autoFocus };
      switch (field.kind) {
        case 'text':
          return h(TextField, {
            ...common, label: field.label, placeholder: field.placeholder, helperText: field.helper,
            multiline: !!field.multiline, minRows: field.multiline ? (field.rows || 1) : undefined,
            value: value ?? '', onChange: e => onChange(e.target.value),
          });
        case 'number':
          return h(TextField, {
            ...common, label: field.label, type: 'number', helperText: field.helper,
            value: value ?? field.default ?? '', onChange: e => onChange(numberFieldValue(field, e.target.value)),
          });
        case 'select':
          return h(FormControl, { size: 'small', fullWidth: true, disabled },
            h(Select, { value: value ?? field.default ?? '', onChange: e => onChange(e.target.value) },
              (field.options || []).map(o => h(MenuItem, { key: String(o.value), value: o.value }, o.label))));
        case 'toggle':
          return h(ToggleButtonGroup, {
            size: 'small', exclusive: true, disabled, value: value ?? field.default ?? null,
            onChange: (e, next) => { if (next !== null) onChange(next); },
          }, (field.options || []).map(o => h(ToggleButton, { key: String(o.value), value: o.value }, o.label)));
        default:
          return null;
      }
    }

    // A list of strings (keepOne: never empty — removing the last row blanks it).
    function ListField({ field, value, onChange, disabled }) {
      const list = Array.isArray(value) && value.length ? value : (field.keepOne ? [''] : []);
      const set = next => onChange(next.length || !field.keepOne ? next : ['']);
      return h(BodyStack, null,
        list.map((v, i) => h(Box, { key: i, sx: { display: 'flex', alignItems: 'center', gap: 0.5 } },
          h(TextField, {
            size: 'small', variant: 'outlined', fullWidth: true, disabled, placeholder: field.placeholder,
            value: v, onChange: e => set(list.map((val, j) => (j === i ? e.target.value : val))),
          }),
          h(IconButton, { size: 'small', disabled: disabled || (field.keepOne && list.length <= 1), onClick: () => set(list.filter((_, j) => j !== i)) },
            h(Icon, { name: 'Close', size: 14 }))
        )),
        h(Button, { size: 'small', variant: 'outlined', disabled, onClick: () => set([...list, '']) }, field.addLabel || '+ Add')
      );
    }

    // A list of objects, one bordered box of sub-fields each (the first one gets the remove button).
    function RecordsField({ field, value, onChange, disabled }) {
      const list = Array.isArray(value) ? value : [];
      const setAt = (i, patch) => onChange(list.map((r, j) => (j === i ? { ...r, ...patch } : r)));
      return h(BodyStack, null,
        list.map((rec, i) => h(Box, { key: i, sx: { display: 'flex', flexDirection: 'column', gap: 1, p: 1, border: 1, borderColor: 'divider', borderRadius: 1 } },
          (field.fields || []).map((sub, k) => {
            const control = h(FieldControl, {
              field: sub, value: (rec || {})[sub.key], disabled, onChange: v => setAt(i, { [sub.key]: v }),
            });
            return k > 0 ? h(React.Fragment, { key: k }, control) : h(Box, { key: k, sx: { display: 'flex', alignItems: 'center', gap: 0.5 } },
              control,
              h(IconButton, { size: 'small', disabled, onClick: () => onChange(list.filter((_, j) => j !== i)) }, h(Icon, { name: 'Close', size: 14 })));
          })
        )),
        h(Button, {
          size: 'small', variant: 'outlined', disabled,
          onClick: () => onChange([...list, JSON.parse(JSON.stringify(field.newItem || {}))]),
        }, field.addLabel || '+ Add')
      );
    }

    function FieldsForm({ node, fields, updateData, isRunningWorkflow }) {
      const disabled = isRunningWorkflow;
      let focused = false;
      return h(BodyStack, null, fields.map((field, i) => {
        if (field.kind === 'caption') {
          return h(Typography, { key: i, variant: 'caption', color: 'text.secondary' }, field.text);
        }
        if (field.kind === 'button') {
          return h(Button, {
            key: i, size: 'small', variant: 'outlined', color: field.color || 'primary', disabled,
            onClick: () => {
              const patch = JSON.parse(JSON.stringify(field.set || {}));
              (field.unset || []).forEach(k => { patch[k] = undefined; });
              updateData(node.id, patch);
            },
          }, field.label);
        }
        const props = {
          key: i, field, disabled, value: node.data[field.key],
          onChange: v => updateData(node.id, fieldPatch(field, v)),
        };
        if (field.kind === 'list') return h(ListField, props);
        if (field.kind === 'records') return h(RecordsField, props);
        // The first plain input gets the focus when the panel opens.
        const autoFocus = !focused && (field.kind === 'text' || field.kind === 'number');
        if (autoFocus) focused = true;
        return h(FieldControl, { ...props, autoFocus });
      }));
    }

    // Wrapper (core type, CUSTOM_FORM "wrapper"): condition groups appear once a
    // Created Node is linked (conditions use its output fields). Groups are OR'd,
    // rows within a group AND'd. `edges` resolves the link.
    function WrapperEditForm({ node, updateData, nodes, edges, isRunningWorkflow }) {
      const linkedId = wrapperLinkedNodeId(node.id, edges);
      const linkedNode = linkedId ? nodes[linkedId] : null;
      const outputFields = linkedNode ? (linkedNode.data.outputs || []) : [];
      const groups = node.data.conditionGroups || [];

      function setGroups(next) { updateData(node.id, { conditionGroups: next }); }
      function updateCond(gi, ci, patch) {
        setGroups(groups.map((g, i) => i !== gi ? g : g.map((c, j) => j !== ci ? c : { ...c, ...patch })));
      }
      function addCond(gi) {
        if (!outputFields.length) return;
        setGroups(groups.map((g, i) => i !== gi ? g : [...g, { key: outputFields[0].key, op: 'eq', value: '' }]));
      }
      function removeCond(gi, ci) {
        setGroups(groups.map((g, i) => i !== gi ? g : g.filter((_, j) => j !== ci)));
      }
      function addGroup() {
        setGroups([...groups, outputFields.length ? [{ key: outputFields[0].key, op: 'eq', value: '' }] : []]);
      }
      function removeGroup(gi) {
        setGroups(groups.filter((_, i) => i !== gi));
      }

      return h(BodyStack, null,
        h(RetriesField, {
          disabled: isRunningWorkflow,
          value: node.data.maxRetries != null ? node.data.maxRetries : 3,
          onChange: v => updateData(node.id, { maxRetries: v }),
        }),
        !linkedNode
          ? h(Typography, { variant: 'caption', color: 'text.secondary' },
              'Link an AI Node via the Ref dot below to set output conditions.')
          : outputFields.length === 0
            ? h(Typography, { variant: 'caption', color: 'text.secondary' }, '(linked node defines no outputs)')
            : h(BodyStack, null,
                groups.length === 0 && h(Typography, { variant: 'caption', color: 'text.secondary' },
                  'No conditions — always considered passed.'),
                groups.map((group, gi) => h(Box, {
                  key: gi,
                  sx: { border: '1px solid', borderColor: 'divider', borderRadius: 1, p: 0.75, display: 'flex', flexDirection: 'column', gap: 0.5 },
                },
                  gi > 0 && h(Typography, { variant: 'caption', color: 'text.secondary', sx: { fontWeight: 'bold' } }, 'OR'),
                  group.map((cond, ci) => h(Box, { key: ci, sx: { display: 'flex', alignItems: 'center', gap: 0.5 } },
                    h(Select, {
                      size: 'small', value: cond.key, disabled: isRunningWorkflow, sx: { minWidth: 0, flex: 1 },
                      onChange: e => updateCond(gi, ci, { key: e.target.value }),
                    },
                      outputFields.map(o => h(MenuItem, { key: o.key, value: o.key }, o.name || o.key))
                    ),
                    // Σ: compare the sum over this Wrapper's attempts (first run + retries).
                    h(Tooltip, { title: cond.total ? 'Comparing the total across attempts' : 'Comparing this attempt\'s value (click for the total)' },
                      h(ToggleButton, {
                        value: 'total', size: 'small', selected: !!cond.total, disabled: isRunningWorkflow,
                        sx: { px: 0.75, py: 0.25, minWidth: 0 },
                        onChange: () => updateCond(gi, ci, { total: !cond.total }),
                      }, 'Σ')),
                    h(Select, {
                      size: 'small', value: cond.op, disabled: isRunningWorkflow, sx: { minWidth: 56 },
                      onChange: e => updateCond(gi, ci, { op: e.target.value }),
                    },
                      WRAPPER_CONDITION_OPS.map(op => h(MenuItem, { key: op, value: op }, WRAPPER_OP_LABELS[op]))
                    ),
                    h(TextField, {
                      size: 'small', variant: 'outlined', disabled: isRunningWorkflow, sx: { flex: 1, minWidth: 0 },
                      placeholder: (cond.op === 'eq' || cond.op === 'neq') ? 'value(s), comma-separated' : 'number',
                      value: cond.value, onChange: e => updateCond(gi, ci, { value: e.target.value }),
                    }),
                    h(IconButton, { size: 'small', disabled: isRunningWorkflow, onClick: () => removeCond(gi, ci) },
                      h(Icon, { name: 'Close', size: 14 }))
                  )),
                  h(Box, { sx: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    h(Button, { size: 'small', disabled: isRunningWorkflow, onClick: () => addCond(gi) }, '+ AND Condition'),
                    h(Button, { size: 'small', color: 'error', disabled: isRunningWorkflow, onClick: () => removeGroup(gi) }, 'Remove Group')
                  )
                )),
                h(Button, { size: 'small', variant: 'outlined', disabled: isRunningWorkflow, onClick: addGroup }, '+ OR Group')
              )
      );
    }

    // CUSTOM_FORM name -> edit form, for core types whose form needs other nodes.
    const CUSTOM_EDIT_FORMS = { wrapper: WrapperEditForm };

    // The one node component for every type (React Flow type "app"; the node's own
    // type is data.__type). Ports/body come from POST /evaluate (data.__view), before
    // its first answer from the type's static ports (data.__typeInfo). React Flow owns
    // drag/pan/zoom/connect; resizing is hand-rolled (NodeResizer's full-length strips
    // would cover the side ports).
    function AppNode(props) {
      const { id, data, selected } = props;
      const type = data.__type;
      const node = { id, type, data };
      const isRunning = data.runStatus === 'running' || data.runStatus === 'starting';
      // Border state, computed in FlowApp's runStatesById (needs sibling nodes).
      const isCardRunning = !!data.__isRunning;
      const isCardPassed = !!data.__isPassed;
      const canRetry = type === 'template' && !isRunning && !data.isRunningWorkflow;
      const [detailOpen, setDetailOpen] = useState(false);
      const nodeWidth = data.__width || NODE_WIDTH;
      const def = data.__view || data.__typeInfo || { title: type, inputs: [], outputs: [] };
      const maxRows = Math.max(def.inputs.length, def.outputs.length, 1);
      const rowsBottom = HEADER_H + maxRows * PORT_ROW_H;
      const updateNodeInternals = useUpdateNodeInternals();
      // Ports come from the node's data (and arrive from the server after the
      // static fallback) — their ids/count can change without the box resizing;
      // force React Flow to re-measure handles whenever they do.
      const portKey = def.inputs.map(p => p.id).join('|') + '>' + def.outputs.map(p => p.id).join('|');
      useEffect(() => { updateNodeInternals(id); }, [id, portKey, updateNodeInternals]);

      const rows = [];
      for (let i = 0; i < maxRows; i++) {
        const inp = def.inputs[i];
        const out = def.outputs[i];
        const top = HEADER_H + i * PORT_ROW_H + PORT_ROW_H / 2;
        rows.push(h(Box, { key: i, sx: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: PORT_ROW_H } },
          inp
            ? h(Box, { sx: { display: 'flex', alignItems: 'center', gap: 0.5, pl: '4px' } },
                h(PortHandle, {
                  nodeId: id, port: inp, isOutput: false, top, onContextMenu: data.onPortContextMenu,
                  colorOverride: data.connectedPorts && data.connectedPorts.has(id + ':' + inp.id + ':in')
                    ? PORT_CONNECTED_COLOR : PORT_UNCONNECTED_COLOR,
                }),
                h(Typography, { variant: 'caption', color: 'text.secondary', sx: { pl: 1.5 } }, inp.label)
              )
            : h(Box, null),
          out
            ? h(Box, { sx: { display: 'flex', alignItems: 'center', gap: 0.5, pr: '4px' } },
                h(Typography, {
                  variant: 'caption',
                  // The default thread_id output is called out visually
                  // (blue, uppercase) to set it apart from user-defined outputs.
                  color: out.id === THREAD_ID_OUTPUT_KEY ? 'primary.main' : 'text.secondary',
                  sx: {
                    pr: 1.5,
                    ...(out.id === THREAD_ID_OUTPUT_KEY ? { textTransform: 'uppercase', fontWeight: 'bold' } : null),
                  },
                }, out.label),
                h(PortHandle, {
                  nodeId: id, port: out, isOutput: true, top, onContextMenu: data.onPortContextMenu,
                  colorOverride: out.type === 'trigger' ? TRIGGER_COLOR
                    : (data.connectedPorts && data.connectedPorts.has(id + ':' + out.id + ':out')
                        ? PORT_CONNECTED_COLOR : PORT_UNCONNECTED_COLOR),
                })
              )
            : h(Box, null)
        ));
      }

    // rfNodes builds a new `data` each render; comparing its keys by reference lets
    // React.memo skip nodes whose values didn't change (e.g. while dragging another).
    function nodePropsEqual(prev, next) {
      // Position isn't a prop here — React Flow moves the wrapper element
      // itself via CSS transform, outside AppNode's render.
      if (prev.id !== next.id || prev.type !== next.type || prev.selected !== next.selected) return false;

      const pk = Object.keys(pd), nk = Object.keys(nd);
      if (pk.length !== nk.length) return false;
      return pk.every(k => pd[k] === nd[k]);
    }
    const MemoizedAppNode = React.memo(AppNode, nodePropsEqual);

    // One React Flow type for every node (node types are only known at run time,
    // from the server). Module scope, so the reference identity never changes.
    const NODE_TYPES = { app: MemoizedAppNode };

    // Custom edge so a selected connection keeps the "click the red dot to
    // delete" affordance — React Flow's default edge only offers click-to-select.
    function AppEdge(props) {
      const { id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, selected, data, markerEnd, style } = props;
      const [edgePath, labelX, labelY] = getBezierPath({ sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition });
      const color = selected ? PALETTE.error.main : (data && data.color) || PALETTE.grey[500];
      return h(React.Fragment, null,
        h(BaseEdge, { id, path: edgePath, markerEnd, style: { ...style, stroke: color, strokeWidth: selected ? 3.5 : 2.5 }, interactionWidth: 20 }),
        selected && h(EdgeLabelRenderer, null,
          h(IconButton, {
            className: 'nodrag nopan', 'aria-label': 'Delete connection',
            onClick: e => { e.stopPropagation(); data.onDelete(id); },

              '&:hover': { bgcolor: 'error.dark' },
            },
          }, h(Icon, { name: 'Close', size: 10 }))
        )
      );
    }
    function edgePropsEqual(prev, next) {
      if (prev.selected !== next.selected) return false;
      if (prev.sourceX !== next.sourceX || prev.sourceY !== next.sourceY) return false;
      if (prev.targetX !== next.targetX || prev.targetY !== next.targetY) return false;
      const pd = prev.data, nd = next.data;

        list.map((v, i) => h(Box, { key: i, sx: { display: 'flex', gap: 1, alignItems: 'center' } },

    // Recursive editor for one output schema field. Only depth 0 shows a
    // "default value" (the only depth that becomes a node widget) and is
    // removable via the caller's onRemove; nested ones remove themselves.
    function OutputFieldEditor(props) {
      const { field, onChange, onRemove, depth } = props;
      const isEnum = field.valueType === 'enum';
      const isArray = field.valueType === 'array';

      function updateChild(key, next) {
        onChange({ ...field, children: field.children.map(c => c.key === key ? next : c) });
      }
      function removeChild(key) {
        onChange({ ...field, children: field.children.filter(c => c.key !== key) });

        variant: 'outlined',

            field.children.map(child => h(OutputFieldEditor, {

    function TemplateManagerDialog(props) {
      const { open, editTarget, onClose, onSave } = props;

            )
